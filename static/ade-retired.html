<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Retired chats — ADE</title>
<!-- Thin host, same shape as static/ade-ledger.html: skin css FIRST so
     _serve_skinned's regex swap keeps working, ade.css SECOND so the frame's
     own tokens win. No xterm/monaco, no boot.js — this window's JS is
     static/js/ade/retiredwin.js and it holds no socket. -->
<link rel="stylesheet" href="/static/css/skins/og.css">
<link rel="stylesheet" href="/static/css/ade.css">
<style>
  /* This page's own frame. Local rather than a new ade.css section: nothing
     here is shared with the arrange. The turn blocks the transcript draws are
     ade.css's own .turnblock/.msg/.bub and are not restyled. */
  #winHead{
    flex-shrink:0; display:flex; align-items:center; gap:10px; height:36px;
    padding:0 14px; background:var(--surface-1); border-bottom:1px solid var(--gridline);
  }
  #winHead .wtitle{ font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-3); font-weight:600; }
  #winHead .ph-spacer{ flex:1; }
  #rtTitle{ font-size:11.5px; color:var(--text-2); }

  #rtBody{ flex:1; min-height:0; display:flex; }

  #rtList{
    width:290px; flex-shrink:0; overflow-y:auto;
    border-right:1px solid var(--gridline); background:var(--surface-1);
  }
  #rtScript{ flex:1; min-width:0; overflow-y:auto; padding:14px 18px; }

  .rt-sess{
    display:flex; align-items:center; gap:7px; padding:7px 10px; cursor:pointer;
    font-size:12px; color:var(--text-2); border-bottom:1px solid var(--gridline);
  }
  .rt-sess:hover{ background:var(--surface-2); color:var(--text-1); }
  .rt-sess.rt-open{ color:var(--text-1); background:var(--surface-2); }
  .rt-caret{ width:10px; color:var(--text-3); }
  .rt-sname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rt-count{ font-size:10px; color:var(--text-3); }
  .rt-date{ font-size:10px; color:var(--text-3); }

  .rt-agent{
    display:flex; align-items:center; gap:7px; padding:5px 10px 5px 26px;
    cursor:pointer; font-size:11.5px; color:var(--text-2);
  }
  .rt-agent:hover{ background:var(--surface-3); color:var(--text-1); }
  .rt-agent.rt-on{ background:var(--surface-3); color:var(--text-1); }
  .rt-agent.rt-nocache{ cursor:default; opacity:.45; }
  .rt-agent.rt-nocache:hover{ background:none; }
  .rt-dot{ width:6px; height:6px; border-radius:50%; background:var(--text-3); flex-shrink:0; }
  /* A retired agent's cache is cleared; the dot marks that, not a failure. */
  .rt-dot.rt-ret{ background:var(--text-2); opacity:.55; }
  .rt-aname{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rt-cache{ color:var(--text-3); font-size:10px; }
  .rt-vessel, .rt-size, .rt-note{ font-size:10px; color:var(--text-3); }

  .rt-empty{ padding:16px; font-size:11.5px; color:var(--text-3); }
</style>
</head>
<body style="height:100vh; display:flex; flex-direction:column; margin:0;">

<div id="winHead">
  <span class="wtitle">Retired chats</span>
  <span id="rtTitle"></span>
  <span class="ph-spacer"></span>
  <button class="tb-btn" id="rtRefresh">refresh</button>
</div>

<div id="rtBody">
  <div id="rtList"></div>
  <div id="rtScript"><div class="rt-empty">pick an agent</div></div>
</div>

<script type="module" src="/static/js/ade/retiredwin.js"></script>
</body>
</html>
