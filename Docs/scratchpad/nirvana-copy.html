<style>
/* ============================================================
   TOKENS
   Two anchors pulled from album art, rest walked off the wheel.
   ============================================================ */
:root{
  /* anchors */
  --blue:#2E7DA8;      /* Nevermind pool */
  --red:#A8332A;       /* In Utero */
  /* derived */
  --amber:#D98A2B;
  --olive:#7E8A3C;
  --violet:#6A4C93;
  --magenta:#B0347A;
  /* neutrals */
  --ink:#12100E;
  --ink-2:#1D1A16;
  --ink-3:#2A2620;
  --news:#EDE7DA;
  --news-2:#DFD7C6;
  --xerox:#8A857C;

  /* runtime surface — flipped per page mode */
  --bg:var(--news);
  --fg:var(--ink);
  --dim:#5C564C;
  --rule:#C6BCA6;
  --card:#F5F1E6;
  --accent:var(--amber);

  --sans:'Inter','Helvetica Neue',Helvetica,Arial,sans-serif;
  --cond:'Helvetica Neue Condensed','Arial Narrow',
         'Helvetica Neue',Impact,sans-serif;
  --mono:'IBM Plex Mono','SF Mono',Menlo,Consolas,monospace;

  --gap:clamp(14px,2vw,26px);
  --measure:64ch;
  --tick:200ms;
}

/* per-page accent — set on <body data-page> */
body[data-page="p1"]{--accent:var(--amber);}
body[data-page="p2"]{--accent:var(--blue);}
body[data-page="p3"]{--accent:var(--red);}
body[data-page="p4"]{--accent:var(--olive);}
body[data-page="p5"]{--accent:var(--violet);}
body[data-page="p6"]{--accent:var(--magenta);}
body[data-page="board"]{--accent:var(--blue);}
body[data-page="splash"]{--accent:var(--red);}

/* loud pages go dark, calm pages stay light. the flip IS the cue. */
body[data-mode="loud"]{
  --bg:var(--ink); --fg:var(--news); --dim:#9A9284;
  --rule:#3A342C; --card:var(--ink-2);
}
body[data-mode="calm"]{
  --bg:var(--news); --fg:var(--ink); --dim:#5C564C;
  --rule:#C6BCA6; --card:#F5F1E6;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--sans);
  font-size:17px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
  transition:background 420ms ease,color 420ms ease;
  overflow-x:hidden;
}
button,input,textarea,select{font:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
a{color:var(--accent);}
img{max-width:100%;display:block;}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}
.hidden{display:none !important;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

/* ============================================================
   XEROX / FLYER TYPE
   Titles are photocopied, not typeset. Brandon's call.
   ============================================================ */
@keyframes grain{
  0%,100%{transform:translate(0,0)}   20%{transform:translate(-2%,1%)}
  40%{transform:translate(1%,-2%)}    60%{transform:translate(-1%,2%)}
  80%{transform:translate(2%,1%)}
}
.grain::after{
  content:""; position:fixed; inset:-150%; z-index:9999;
  pointer-events:none; opacity:.055; animation:grain 900ms steps(4) infinite;
  background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'>\
<filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4'/>\
</filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.flyer{
  font-family:var(--cond);
  font-weight:700; text-transform:uppercase;
  letter-spacing:-.02em; line-height:.92;
  transform:rotate(-.7deg) scaleY(1.06);
  filter:contrast(1.35);
  text-shadow:
     .5px 0 0 currentColor, -.5px 0 0 currentColor,
     0 .5px 0 currentColor, 1.5px 1.5px 0 rgba(0,0,0,.16);
}
.flyer-xl{font-size:clamp(46px,9vw,132px);}
.flyer-l {font-size:clamp(32px,5.2vw,68px);}
.flyer-m {font-size:clamp(22px,3vw,38px);}
.flyer-s {font-size:clamp(15px,1.7vw,21px);letter-spacing:.06em;transform:none;}

/* the toner-stripe: a band of solid accent behind photocopied type */
.stamp{
  display:inline-block; padding:.06em .3em .12em;
  background:var(--accent); color:var(--bg);
  transform:rotate(-1.2deg); filter:contrast(1.2);
}

.kicker{
  font-family:var(--mono); font-size:12px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--dim);
}

/* ============================================================
   CHROME — persistent nav + tile ticker
   ============================================================ */
#chrome{
  position:fixed; top:0; left:0; right:0; z-index:800;
  display:flex; align-items:center; gap:14px;
  padding:9px clamp(12px,2.4vw,26px);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(9px);
  border-bottom:1px solid var(--rule);
}
#chrome .brand{font-family:var(--cond);font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;font-size:17px;}
#chrome nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap;}
#chrome nav button{
  font-family:var(--mono); font-size:11px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 9px;
  border:1px solid transparent; border-radius:2px; color:var(--dim);
  transition:color 160ms,border-color 160ms,background 160ms;
}
#chrome nav button:hover{color:var(--fg);border-color:var(--rule);}
#chrome nav button[aria-current="page"]{
  color:var(--bg); background:var(--accent); border-color:var(--accent);
}
#chrome nav button .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--accent);margin-left:5px;vertical-align:middle;
}
#chrome nav button[aria-current="page"] .dot{background:var(--bg);}

main{padding-top:52px;min-height:100vh;}

/* ============================================================
   LAYOUT — calm is one column, loud is a Z-grid
   ============================================================ */
.wrap{width:min(100% - 2*var(--gap),1220px);margin-inline:auto;}
.calm-col{width:min(100% - 2*var(--gap),var(--measure));margin-inline:auto;}
.calm-shell{display:grid;grid-template-columns:1fr 118px;gap:clamp(18px,3vw,44px);
  width:min(100% - 2*var(--gap),1080px);margin-inline:auto;}
@media(max-width:860px){.calm-shell{grid-template-columns:1fr;}}

.zgrid{display:grid;grid-template-columns:repeat(12,1fr);
  gap:var(--gap);align-items:start;}
.zgrid > *{min-width:0;}
.c12{grid-column:span 12;} .c8{grid-column:span 8;}
.c7{grid-column:span 7;}   .c6{grid-column:span 6;}
.c5{grid-column:span 5;}   .c4{grid-column:span 4;}
.c3{grid-column:span 3;}
@media(max-width:900px){
  .c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12;}
}

section.page{padding:clamp(22px,4vw,54px) 0 140px;}
.page-head{margin-bottom:clamp(20px,3.4vw,44px);}

/* ============================================================
   READ — passages, lyrics, timeline
   ============================================================ */
.setup{font-style:italic;color:var(--dim);
  border-left:3px solid var(--accent);padding-left:14px;margin:0 0 18px;}
.label-line,.instruction{font-family:var(--mono);font-size:12px;
  letter-spacing:.06em;color:var(--dim);}
.label-line{text-transform:uppercase;margin:0 0 6px;}
.instruction{margin:16px 0 26px;padding:9px 0;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);}
.prose p{margin:0 0 1.15em;}
.prose p[data-para]{position:relative;}
.prose p[data-para]::before{
  content:attr(data-para); position:absolute; left:-2.6em; top:.15em;
  font-family:var(--mono); font-size:11px; color:var(--dim);
}
@media(max-width:1000px){.prose p[data-para]::before{position:static;
  display:inline-block;margin-right:.6em;}}
.prose p.flash{animation:flash 1600ms ease;}
@keyframes flash{
  0%{background:color-mix(in srgb,var(--accent) 38%,transparent);}
  100%{background:transparent;}
}
.footnotes{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);
  font-size:14px;color:var(--dim);}
.footnotes li{margin-bottom:5px;}

.lyric{font-family:var(--mono);font-size:15px;line-height:1.95;
  white-space:pre-wrap;margin:0;}
.lyric .ln{color:var(--dim);}

.timeline{list-style:none;margin:0;padding:0;
  border-left:2px solid var(--accent);}
.timeline li{position:relative;padding:0 0 18px 20px;}
.timeline li::before{content:"";position:absolute;left:-6px;top:.55em;
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);border:2px solid var(--bg);}
.timeline .d{font-family:var(--mono);font-size:12px;
  letter-spacing:.05em;color:var(--accent);}

.source-line{font-family:var(--mono);font-size:11px;
  color:var(--dim);margin-top:7px;line-height:1.5;}

/* ============================================================
   B-ROLL — vertical sprocket strip, calm pages, right rail
   ============================================================ */
.broll{position:sticky;top:66px;align-self:start;}
.broll .strip{background:#0E0C0A;padding:16px 7px;border-radius:2px;
  box-shadow:0 2px 18px rgba(0,0,0,.22);}
.broll .frame{background:#1B1815;margin-bottom:11px;position:relative;
  aspect-ratio:4/3;overflow:hidden;}
.broll .frame:last-child{margin-bottom:0;}
.broll .frame img{width:100%;height:100%;object-fit:cover;
  filter:grayscale(.5) contrast(1.1);}
.broll .frame.empty{display:grid;place-items:center;
  border:1px dashed #4A423A;}
.broll .frame.empty span{font-family:var(--mono);font-size:9px;
  color:#6E6459;text-align:center;padding:4px;line-height:1.3;}
.broll .perfs{display:flex;justify-content:space-between;padding:0 2px 7px;}
.broll .perfs i{width:7px;height:9px;background:var(--news);
  border-radius:1px;display:block;opacity:.86;}
.broll .cap{font-family:var(--mono);font-size:10px;color:var(--dim);
  margin-top:9px;line-height:1.45;}
/* barely alive — one frame breathes, not a carousel */
@keyframes breathe{0%,92%,100%{transform:scale(1)}96%{transform:scale(1.017)}}
.broll .frame img{animation:breathe 11s ease-in-out infinite;}
@media(prefers-reduced-motion:reduce){.broll .frame img{animation:none;}}

/* ============================================================
   NODES — exam item forms stay verbatim. only the frame is designed.
   ============================================================ */
.node{border:1px solid var(--rule);background:var(--card);
  padding:clamp(15px,2vw,24px);margin:0 0 var(--gap);
  border-radius:3px;position:relative;}
.node .qno{font-family:var(--mono);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-bottom:8px;
  display:flex;gap:9px;align-items:center;}
.node .stem{margin:0 0 14px;}
.node.correct{border-color:var(--accent);}
.node.answered{opacity:.97;}

/* idle-pulse: unanswered only, loud pages only. removed on answer. */
@keyframes idlepulse{
  0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent);}
  50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent);}
}
body[data-mode="loud"] .node.pulse:not(.answered){
  animation:idlepulse 2.6s ease-in-out infinite;}
@media(prefers-reduced-motion:reduce){.node.pulse{animation:none !important;}}

.opts{list-style:none;margin:0;padding:0;display:grid;gap:7px;}
.opts button{
  width:100%;text-align:left;padding:11px 13px;
  border:1px solid var(--rule);border-radius:2px;background:transparent;
  transition:border-color 160ms,background 160ms,transform var(--tick);
}
.opts button:hover:not(:disabled){border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 7%,transparent);}
.opts button:disabled{cursor:default;}
.opts button.picked-right{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 17%,transparent);
  animation:hit 220ms cubic-bezier(.2,1.5,.4,1);}
.opts button.picked-wrong{border-color:var(--red);
  background:color-mix(in srgb,var(--red) 12%,transparent);
  animation:shake 220ms ease;}
.opts button.was-right{border-color:var(--accent);border-style:dashed;}
@keyframes hit{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
  75%{transform:translateX(5px)}}

/* micro-feedback burst on a correct hit */
.burst{position:absolute;pointer-events:none;width:9px;height:9px;
  border-radius:50%;background:var(--accent);z-index:900;}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0;}}

.cr textarea{width:100%;min-height:120px;padding:12px;
  border:1px solid var(--rule);border-radius:2px;background:var(--bg);
  resize:vertical;line-height:1.6;}
.credit-line{font-family:var(--mono);font-size:11px;color:var(--dim);
  margin-top:9px;}
.node .actions{display:flex;gap:10px;align-items:center;margin-top:12px;
  flex-wrap:wrap;}
.btn{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;padding:9px 15px;border:1px solid var(--fg);
  border-radius:2px;transition:background 160ms,color 160ms,transform var(--tick);}
.btn:hover{background:var(--fg);color:var(--bg);}
.btn-accent{border-color:var(--accent);background:var(--accent);color:var(--bg);}
.btn-accent:hover{filter:brightness(1.12);background:var(--accent);color:var(--bg);}
.btn:disabled{opacity:.4;cursor:default;}

.feedback{margin-top:12px;padding:11px 13px;border-left:3px solid var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:15px;}
.feedback h4{margin:0 0 6px;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
.feedback ul{margin:0;padding-left:18px;}

.defbox{border:2px solid var(--fg);padding:13px 15px;margin:0 0 12px;
  font-size:15px;background:transparent;}
.defbox p{margin:0 0 6px;}
.defbox p:last-child{margin:0;}

.wikilink{border-bottom:1px dotted var(--accent);cursor:pointer;
  color:var(--accent);}

/* ============================================================
   MAGNETIC CTA — loud pages
   ============================================================ */
.magnet{position:relative;display:inline-block;}
.magnet .btn{transition:transform 120ms ease-out;}

/* ============================================================
   TILES · CHIPS · STACKS · SYNTH
   ============================================================ */
.tile{border:1px solid var(--rule);background:var(--card);padding:12px 13px;
  border-radius:3px;position:relative;overflow:hidden;
  transition:transform var(--tick),border-color 160ms;}
.tile[data-r="common"]  {border-left:4px solid var(--xerox);}
.tile[data-r="uncommon"]{border-left:4px solid var(--blue);}
.tile[data-r="rare"]    {border-left:4px solid var(--amber);}
.tile[data-r="rarest"]  {border-left:4px solid var(--magenta);}
.tile .claim{font-size:14.5px;line-height:1.5;margin:0 0 7px;}
.tile .meta{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);
  display:flex;gap:9px;justify-content:space-between;}
.tile.locked{opacity:.34;filter:grayscale(1);}
.tile.just-got{animation:hit 260ms cubic-bezier(.2,1.5,.4,1);}

/* footer ticker — collected tiles only, empty until the first */
#rail{position:fixed;left:0;right:0;bottom:0;z-index:700;
  background:var(--ink);color:var(--news);
  border-top:1px solid var(--rule);overflow:hidden;height:36px;}
#rail .track{display:flex;gap:34px;white-space:nowrap;
  padding:9px 0;animation:roll 46s linear infinite;width:max-content;}
#rail .track span{font-family:var(--mono);font-size:11.5px;letter-spacing:.05em;}
#rail .track span b{color:var(--accent);font-weight:400;}
#rail.empty{opacity:.42;}
#rail.empty .track{animation:none;padding-left:16px;}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#rail:hover .track{animation-play-state:paused;}
body:not([data-mode]) #rail{display:none;}

/* chips — poker weight, embossed N, drops and pins */
.chip{width:46px;height:46px;border-radius:50%;position:relative;
  display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 34% 30%,
    color-mix(in srgb,var(--chipc) 88%,#fff) 0%,var(--chipc) 58%,
    color-mix(in srgb,var(--chipc) 76%,#000) 100%);
  box-shadow:0 3px 0 color-mix(in srgb,var(--chipc) 62%,#000),
             0 5px 9px rgba(0,0,0,.42),
             inset 0 0 0 4px color-mix(in srgb,var(--chipc) 80%,#fff),
             inset 0 0 0 6px var(--chipc);
  --chipc:var(--accent);
}
.chip::after{content:"N";font-family:var(--cond);font-weight:700;
  font-size:19px;color:color-mix(in srgb,var(--chipc) 40%,#000);
  text-shadow:0 1px 0 color-mix(in srgb,var(--chipc) 92%,#fff);}
.chip .edge{position:absolute;inset:-1px;border-radius:50%;
  background:repeating-conic-gradient(
    rgba(255,255,255,.5) 0deg 8deg,transparent 8deg 22deg);
  mask:radial-gradient(circle,transparent 62%,#000 63%);
  -webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);}
.chip[data-r="common"]  {--chipc:#8A857C;}
.chip[data-r="uncommon"]{--chipc:#2E7DA8;}
.chip[data-r="rare"]    {--chipc:#D98A2B;}
.chip[data-r="rarest"]  {--chipc:#B0347A;}
@keyframes chipdrop{
  0%{transform:translateY(-120px) rotate(-22deg) scale(1.25);opacity:0;}
  62%{transform:translateY(6px) rotate(3deg) scale(1);opacity:1;}
  80%{transform:translateY(-4px) rotate(-1deg);}
  100%{transform:translateY(0) rotate(0);opacity:1;}
}
.chip.dropping{animation:chipdrop 200ms cubic-bezier(.3,1.3,.5,1) forwards;}
.chip-slot{display:flex;gap:9px;align-items:center;margin-top:13px;
  min-height:46px;}
.chip-slot .lab{font-family:var(--mono);font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}

/* card stacks — a physical pile, dealt with depth */
.stack{position:relative;height:210px;perspective:900px;}
.stack .card{position:absolute;inset:0;border-radius:5px;
  transform-style:preserve-3d;transition:transform 380ms cubic-bezier(.3,.9,.3,1);
  cursor:pointer;}
.stack .card .face{position:absolute;inset:0;border-radius:5px;
  backface-visibility:hidden;padding:14px;overflow:auto;
  border:1px solid var(--rule);}
.stack .card .back{
  background-color:#17150F;background-size:74px 74px;
  background-blend-mode:luminosity;
  box-shadow:inset 0 0 0 6px #0C0B08, inset 0 0 44px rgba(0,0,0,.65);
  display:grid;place-items:center;}
.stack .card .back .mark{font-family:var(--cond);font-weight:700;
  text-transform:uppercase;letter-spacing:.34em;font-size:13px;
  color:rgba(237,231,218,.5);}
.stack .card .front{background:var(--card);transform:rotateY(180deg);}
.stack .card.flipped{transform:rotateY(180deg) translateZ(0) !important;}
.stack .hint{position:absolute;bottom:-26px;left:0;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);}

/* synth — a caption, nothing more. no hover state. found by curiosity. */
.synth-cap{cursor:pointer;}
.synth-cap.found{color:var(--magenta);}
.synth-panel{border:1px solid var(--magenta);padding:14px;margin-top:11px;
  background:color-mix(in srgb,var(--magenta) 7%,transparent);}
.synth-panel .ask{font-style:italic;margin:0 0 11px;}

/* media */
.fig{margin:0;}
.fig img{border:1px solid var(--rule);border-radius:2px;}
.fig figcaption{font-size:13.5px;color:var(--dim);margin-top:7px;line-height:1.5;}
.fig.empty .ph{aspect-ratio:3/2;border:1px dashed var(--rule);
  display:grid;place-items:center;padding:14px;text-align:center;}
.fig.empty .ph span{font-family:var(--mono);font-size:10.5px;
  color:var(--dim);line-height:1.5;}

/* directional cue — points at the next click target, loud pages */
.cue{font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);display:flex;
  align-items:center;gap:7px;}
.cue .arr{display:inline-block;animation:nudge 1.7s ease-in-out infinite;}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}

/* ============================================================
   PAGE 3 — node/edge graph
   ============================================================ */
#graph-wrap{border:1px solid var(--rule);background:var(--card);
  border-radius:3px;position:relative;overflow:hidden;height:520px;}
#graph{width:100%;height:100%;display:block;touch-action:none;}
#graph .gnode{cursor:grab;}
#graph .gnode.dragging{cursor:grabbing;}
#relpick{position:absolute;background:var(--bg);border:1px solid var(--accent);
  border-radius:3px;padding:9px;display:grid;gap:5px;z-index:40;
  box-shadow:0 8px 26px rgba(0,0,0,.4);}
#relpick button{font-family:var(--mono);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;padding:7px 13px;border:1px solid var(--rule);
  border-radius:2px;text-align:left;}
#relpick button:hover{background:var(--accent);color:var(--bg);}
.edge-log{font-family:var(--mono);font-size:11.5px;line-height:1.7;}
.edge-log .model{color:var(--accent);}

/* ============================================================
   PAGE 6 — arcade cabinet
   ============================================================ */
.cab{--cabc:#1A1614;
  background:linear-gradient(180deg,#241E1A,#141110);
  border-radius:16px 16px 6px 6px;padding:20px 20px 26px;
  box-shadow:0 26px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);
  border:1px solid #332B26;max-width:940px;margin-inline:auto;position:relative;}
.cab::before,.cab::after{content:"";position:absolute;top:74px;bottom:26px;
  width:16px;background:linear-gradient(90deg,var(--magenta),var(--amber));
  opacity:.7;border-radius:3px;}
.cab::before{left:-9px;} .cab::after{right:-9px;}
.marquee{background:linear-gradient(180deg,#F3ECDD,#CFC5B0);
  color:#141110;border-radius:7px;padding:11px 18px;margin-bottom:16px;
  text-align:center;box-shadow:inset 0 -3px 10px rgba(0,0,0,.25);}
.marquee .t{font-family:var(--cond);font-weight:700;text-transform:uppercase;
  font-size:clamp(20px,3.4vw,34px);letter-spacing:.02em;line-height:1;}
.marquee .s{font-family:var(--mono);font-size:10px;letter-spacing:.3em;
  text-transform:uppercase;color:#5A5148;margin-top:4px;}
.screen{background:#07090A;border-radius:6px;padding:9px;
  border:2px solid #0E1214;position:relative;overflow:hidden;}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  border-radius:6px;}
.screen canvas{display:block;width:100%;height:auto;
  background:#07090A;border-radius:3px;
  image-rendering:pixelated;}
.hud{display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:#E4DCCB;padding:9px 3px 0;}
.hud b{color:var(--amber);font-weight:400;}
.hud .hs{color:var(--magenta);}
.panel{margin-top:16px;background:#0F0D0C;border:1px solid #2B2521;
  border-radius:5px;padding:15px;color:#E4DCCB;}
.panel h3{font-family:var(--cond);text-transform:uppercase;
  font-size:19px;margin:0 0 9px;letter-spacing:.02em;}
.tier{display:flex;gap:9px;flex-wrap:wrap;}
.tier button{font-family:var(--mono);font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;padding:11px 17px;border:1px solid #4A3F38;
  border-radius:3px;color:#E4DCCB;}
.tier button:hover{border-color:var(--amber);color:var(--amber);}
.tier button.on{background:var(--amber);color:#141110;border-color:var(--amber);}
.locknote{font-family:var(--mono);font-size:10.5px;color:#8A7F73;margin-top:9px;}
.brickq{position:absolute;inset:9px;background:rgba(7,9,10,.96);
  display:grid;place-items:center;padding:22px;z-index:20;border-radius:3px;}
.brickq .inner{max-width:640px;width:100%;color:#E4DCCB;}
.brickq .stem{margin:0 0 15px;font-size:16px;line-height:1.55;}
.brickq .opts button{border-color:#4A3F38;color:#E4DCCB;}
.brickq .timer{height:4px;background:#2B2521;border-radius:2px;
  overflow:hidden;margin-bottom:15px;}
.brickq .timer i{display:block;height:100%;background:var(--amber);
  transform-origin:left;}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ============================================================
   LEADERBOARD
   ============================================================ */
.board-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gap);}
.card-box{border:1px solid var(--rule);background:var(--card);
  border-radius:3px;padding:clamp(15px,2vw,22px);}
.card-box h3{font-family:var(--cond);text-transform:uppercase;
  font-size:22px;margin:0 0 12px;letter-spacing:.01em;}

/* nickelodeon-meets-japanese-TV: dense, fast, loud, not slime */
.wall{position:relative;border-radius:4px;padding:22px;overflow:hidden;
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 2px,transparent 2px 15px),
    linear-gradient(178deg,#6A4C93 0%,#B0347A 42%,#D98A2B 100%);
  box-shadow:inset 0 0 90px rgba(0,0,0,.4);}
.wall .drip{position:absolute;top:0;left:0;right:0;height:36px;
  background:var(--amber);
  clip-path:polygon(0 0,100% 0,100% 42%,96% 78%,92% 40%,86% 88%,
    81% 38%,74% 66%,69% 34%,62% 92%,56% 40%,49% 72%,43% 36%,
    36% 84%,30% 42%,24% 64%,18% 34%,11% 80%,5% 40%,0 60%);}
.wall .drip.two{background:var(--magenta);opacity:.85;
  clip-path:polygon(0 0,100% 0,100% 30%,94% 60%,88% 28%,79% 70%,
    71% 30%,63% 54%,54% 26%,45% 64%,37% 30%,28% 58%,19% 26%,
    9% 62%,0 32%);}
.wall .nails{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));
  gap:16px;margin-top:34px;position:relative;z-index:2;}
.nail{aspect-ratio:1;display:grid;place-items:center;position:relative;}
.nail::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:7px;height:7px;border-radius:50%;
  background:linear-gradient(180deg,#E6E0D2,#7C756A);
  box-shadow:0 1px 3px rgba(0,0,0,.6);}
.nail.empty::after{content:"";width:44px;height:44px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.26);}
.nail .hung{margin-top:9px;transform-origin:50% -9px;
  animation:swing 4.2s ease-in-out infinite;}
@keyframes swing{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@media(prefers-reduced-motion:reduce){.nail .hung{animation:none;}}

/* tokens — 45s on a spindle. rarity changes the label, not all equal. */
.spindle{position:relative;height:230px;display:grid;place-items:end center;}
.spindle .rod{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:7px;height:200px;border-radius:4px;
  background:linear-gradient(90deg,#9A9284,#4A443C,#9A9284);}
.spindle .base{position:absolute;bottom:0;left:50%;transform:translateX(-50%);
  width:150px;height:13px;border-radius:50%;
  background:linear-gradient(180deg,#4A443C,#232019);}
.rec{position:absolute;left:50%;width:118px;height:118px;border-radius:50%;
  transform:translateX(-50%) rotateX(70deg);
  background:radial-gradient(circle,
    var(--lab) 0 21%, #17150F 22% 24%, #211E17 25% 100%);
  box-shadow:0 2px 5px rgba(0,0,0,.5);--lab:#8A857C;
  display:grid;place-items:center;}
.rec::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--bg);}
.rec[data-r="uncommon"]{--lab:var(--blue);}
.rec[data-r="rare"]{--lab:var(--amber);}
.rec[data-r="rarest"]{--lab:var(--magenta);}
.rec.spin{animation:spin45 2.4s linear infinite;}
@keyframes spin45{to{transform:translateX(-50%) rotateX(70deg) rotate(360deg);}}
.token-key{font-family:var(--mono);font-size:10.5px;color:var(--dim);
  display:grid;gap:3px;margin-top:9px;}
.token-key i{display:inline-block;width:9px;height:9px;border-radius:50%;
  margin-right:7px;vertical-align:middle;}

/* trophies + plaque */
.trophies{display:flex;gap:13px;flex-wrap:wrap;}
.troph{text-align:center;opacity:.28;filter:grayscale(1);
  transition:opacity 300ms,filter 300ms;}
.troph.won{opacity:1;filter:none;}
.troph .cup{font-size:32px;line-height:1;}
.troph .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);margin-top:4px;}
.plaque-case{position:relative;border-radius:4px;padding:26px;
  background:linear-gradient(150deg,rgba(180,215,225,.24),rgba(255,255,255,.06) 42%,
    rgba(140,180,195,.2));
  border:1px solid rgba(255,255,255,.3);
  box-shadow:inset 0 0 44px rgba(255,255,255,.14),0 8px 26px rgba(0,0,0,.2);
  cursor:not-allowed;}
.plaque-case::after{content:"";position:absolute;inset:0;border-radius:4px;
  background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.32) 46%,
    transparent 56%);pointer-events:none;}
.plaque{background:linear-gradient(160deg,#C9A227,#8C6D12 48%,#E3C766);
  border-radius:2px;padding:20px;text-align:center;color:#2A2005;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.22);}
.plaque .eng{font-family:var(--cond);text-transform:uppercase;
  letter-spacing:.16em;font-size:15px;line-height:1.7;}
.plaque.locked{filter:grayscale(1) brightness(.55);}
.plaque.locked .eng{color:#0F0D06;}

/* organizer + chart */
table.reg{width:100%;border-collapse:collapse;font-size:14px;}
table.reg th,table.reg td{border:1px solid var(--fg);padding:9px 11px;
  text-align:left;vertical-align:top;}
table.reg th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;}
.circles{display:flex;gap:7px;}
.circles button{width:30px;height:30px;border-radius:50%;
  border:2px solid var(--fg);font-family:var(--mono);font-size:12px;}
.circles button.on{background:var(--accent);border-color:var(--accent);
  color:var(--bg);}
.circles button:disabled{opacity:.3;cursor:not-allowed;}

/* essay builder */
.frag-tray{display:flex;flex-wrap:wrap;gap:9px;}
.frag{border:1px solid var(--rule);background:var(--card);border-radius:2px;
  padding:8px 11px;font-size:14px;cursor:grab;user-select:none;
  border-left:4px solid var(--xerox);}
.frag[data-r="uncommon"]{border-left-color:var(--blue);}
.frag[data-r="rare"]{border-left-color:var(--amber);}
.frag[data-r="rarest"]{border-left-color:var(--magenta);}
.frag.used{opacity:.32;cursor:default;}
.frag.dragging{opacity:.5;}
.para{border:1px solid var(--rule);border-radius:3px;padding:14px;
  margin-bottom:13px;background:var(--card);}
.para.locked{opacity:.44;}
.para h4{font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;margin:0 0 9px;color:var(--dim);
  display:flex;justify-content:space-between;gap:9px;}
.dropzone{min-height:56px;border:2px dashed var(--rule);border-radius:3px;
  padding:9px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;
  transition:border-color 160ms,background 160ms;}
.dropzone.over{border-color:var(--accent);
  background:color-mix(in srgb,var(--accent) 8%,transparent);}
.dropzone .placed{border-left-width:4px;}
.para textarea{width:100%;margin-top:9px;min-height:88px;padding:11px;
  border:1px solid var(--rule);border-radius:2px;background:var(--bg);
  line-height:1.6;resize:vertical;}
.para .req{font-family:var(--mono);font-size:10.5px;color:var(--dim);
  margin-top:6px;}

/* read-aloud projector */
#aloud{position:fixed;inset:0;z-index:3000;background:var(--ink);
  color:var(--news);display:grid;place-items:center;padding:6vw;}
#aloud .txt{font-size:clamp(32px,4.4vw,58px);line-height:1.42;
  max-width:22ch;text-align:left;}
#aloud .nav{position:absolute;bottom:26px;left:0;right:0;text-align:center;
  font-family:var(--mono);font-size:12px;letter-spacing:.16em;
  text-transform:uppercase;color:#8A7F73;}

/* rubric — descriptors only, never a score */
.rubric-grid{display:grid;gap:9px;}
.rubric-row{display:grid;grid-template-columns:96px 1fr;gap:13px;
  border-bottom:1px solid var(--rule);padding-bottom:9px;}
.rubric-row .lvl{font-family:var(--mono);font-size:11px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--dim);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);}
@media(max-width:760px){.two-col{grid-template-columns:1fr;}}

/* avatar presets */
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
  gap:11px;}
.av{aspect-ratio:3/4;border:1px solid var(--rule);border-radius:3px;
  background:var(--bg);display:grid;place-items:center;padding:6px;
  transition:border-color 160ms,transform var(--tick);}
.av:hover{border-color:var(--accent);}
.av.on{border-color:var(--accent);border-width:2px;
  background:color-mix(in srgb,var(--accent) 10%,transparent);}
.av svg{width:100%;height:auto;}

/* splash */
#splash-hero{min-height:100vh;display:grid;align-items:end;position:relative;
  background:#0A0908;overflow:hidden;}
#splash-hero .bg{position:absolute;inset:0;object-fit:cover;
  width:100%;height:100%;filter:grayscale(.65) contrast(1.2) brightness(.6);}
#splash-hero .bg-fallback{position:absolute;inset:0;
  background:radial-gradient(circle at 30% 26%,#3A322B,#0A0908 68%);}
#splash-hero .veil{position:absolute;inset:0;
  background:linear-gradient(0deg,#0A0908 4%,rgba(10,9,8,.42) 46%,transparent);}
#splash-hero .inner{position:relative;z-index:3;color:var(--news);
  padding:0 clamp(18px,5vw,80px) clamp(50px,9vh,110px);
  width:min(100%,1220px);margin-inline:auto;}
#splash-hero .line{font-size:clamp(17px,2.1vw,25px);max-width:34ch;
  color:#D8D0C1;margin:18px 0 30px;line-height:1.5;}

/* misc */
.done-banner{border:2px solid var(--accent);padding:15px 18px;
  margin-bottom:var(--gap);display:flex;gap:13px;align-items:center;
  flex-wrap:wrap;}
.done-banner .flyer-m{margin:0;}
.progress{font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--dim);}
.bar{height:5px;background:var(--rule);border-radius:3px;overflow:hidden;
  margin-top:6px;}
.bar i{display:block;height:100%;background:var(--accent);
  transition:width 420ms ease;}
.toast{position:fixed;bottom:52px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--news);padding:11px 19px;border-radius:3px;
  font-family:var(--mono);font-size:12px;letter-spacing:.06em;z-index:2000;
  box-shadow:0 8px 30px rgba(0,0,0,.45);animation:toastin 240ms ease;}
@keyframes toastin{from{opacity:0;transform:translate(-50%,14px)}}
</style>

<body class="grain" data-page="splash">

<header id="chrome" class="hidden">
  <span class="brand">Nirvana</span>
  <nav id="nav"></nav>
</header>

<main id="app"></main>

<div id="rail" class="empty"><div class="track"></div></div>

<script>
"use strict";
/* ============================================================
   DATA + SAVE
   ============================================================ */
const D = JSON.parse(document.getElementById('canvas-data').textContent);
const IMG = 'images/';
const SAVE_KEY = 'nirvana-canvas-v1';

const PAGE_ORDER = ['p1','p2','p3','p4','p5','p6'];
const PAGE_NAV   = [['p1','1'],['p2','2'],['p3','3'],['p4','4'],['p5','5'],
                    ['p6','6'],['board','Board']];

const blankSave = () => ({
  answers:{},        /* nodeId -> {correct, value, at} */
  tiles:[],          /* collected tile ids */
  chips:[],          /* node ids that dropped a chip */
  synth:[],          /* found synth ids */
  edges:[],          /* {from,to,relation} student-drawn */
  avatar:{preset:null,name:''},
  difficulty:null, dlocked:false, highscore:0,
  miniexam:{answers:{},submitted:false},
  essay:{},          /* slot -> {frags:[], text:'', outside:''} */
  organizer:{D1:false,D2:false,D3:false,D4:false,D5:false},
  chosenIssue:null,
  seenSplash:false
});

let S = load();
function load(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return blankSave();
    return Object.assign(blankSave(), JSON.parse(raw));
  }catch(e){ return blankSave(); }
}
function save(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
  catch(e){ toast('Save failed — storage blocked'); }
}

/* ============================================================
   LOOKUPS
   ============================================================ */
const page = id => D.pages.find(p=>p.id===id);
const allNodes = p => (p.nodes||[]);
const allTiles = (()=>{ const m={};
  D.pages.forEach(p=>(p.tiles||[]).forEach(t=>m[t.id]=t)); return m; })();
const tileList = Object.values(allTiles);
const allSynth = (()=>{ const a=[];
  D.pages.forEach(p=>(p.synth||[]).forEach(s=>a.push(Object.assign({page:p.id},s))));
  return a; })();
const nodeById = (()=>{ const m={};
  D.pages.forEach(p=>allNodes(p).forEach(n=>m[n.id]=Object.assign({page:p.id},n)));
  return m; })();
const allDocs = (()=>{ const m={};
  D.pages.forEach(p=>{ if(p.doc) m[p.doc.id]=Object.assign({page:p.id},p.doc);
    (p.docs||[]).forEach(d=>m[d.id]=Object.assign({page:p.id},d)); });
  return m; })();

const synthById = (()=>{ const m={};
  allSynth.forEach(s=>m[s.id]=s); return m; })();

/* A fragment's source may be a node, a mini-exam node, or a synth card,
   and may name two of them split on "/". All named sources must be done. */
function fragmentEarned(f){
  return String(f.from).split('/').map(s=>s.trim()).filter(Boolean)
    .every(ref =>
      (S.answers[ref] && S.answers[ref].correct !== false) ||
      (S.miniexam.answers[ref] !== undefined) ||
      S.synth.includes(ref));
}

/* page completion — every node answered. p6 is the mini-exam. */
function pageDone(pid){
  if(pid==='p6') return !!S.miniexam.submitted;
  const p = page(pid); if(!p) return false;
  const ns = allNodes(p);
  return ns.length>0 && ns.every(n=>S.answers[n.id]);
}
function pageProgress(pid){
  if(pid==='p6'){
    const mx = page('p6').miniexam.nodes;
    return [Object.keys(S.miniexam.answers).length, mx.length];
  }
  const ns = allNodes(page(pid));
  return [ns.filter(n=>S.answers[n.id]).length, ns.length];
}

/* ============================================================
   DOM HELPERS
   ============================================================ */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(),v);
    else n.setAttribute(k,v);
  }
  kids.flat().forEach(k=>{ if(k===null||k===undefined||k===false) return;
    n.append(k.nodeType?k:document.createTextNode(k)); });
  return n;
}
const esc = s => String(s??'').replace(/[&<>"]/g,
  c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg,ms=2400){
  const t = el('div',{class:'toast'},msg);
  document.body.append(t);
  setTimeout(()=>t.remove(),ms);
}

/* burst: 150-250ms micro-feedback on a correct hit */
function burst(target){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = target.getBoundingClientRect();
  for(let i=0;i<9;i++){
    const b = el('div',{class:'burst'});
    b.style.left = (r.left + r.width/2) + 'px';
    b.style.top  = (r.top  + r.height/2) + 'px';
    b.style.position = 'fixed';
    const a = Math.random()*Math.PI*2, d = 26+Math.random()*44;
    b.style.setProperty('--dx', Math.cos(a)*d+'px');
    b.style.setProperty('--dy', Math.sin(a)*d+'px');
    b.style.animation = 'fly 230ms ease-out forwards';
    document.body.append(b);
    setTimeout(()=>b.remove(),260);
  }
}

/* magnetic CTA — loud pages only */
function magnetize(btn){
  const wrap = btn.closest('.magnet') || btn;
  wrap.addEventListener('pointermove', e=>{
    const r = btn.getBoundingClientRect();
    const dx = (e.clientX - (r.left+r.width/2))*.28;
    const dy = (e.clientY - (r.top +r.height/2))*.34;
    btn.style.transform = `translate(${dx}px,${dy}px)`;
  });
  wrap.addEventListener('pointerleave', ()=>{ btn.style.transform=''; });
}

function collectTile(id){
  if(!id || S.tiles.includes(id)) return false;
  S.tiles.push(id); save(); renderRail();
  const t = allTiles[id];
  if(t) toast('Fact tile collected — ' + t.rarity);

}
/* a correct answer on a page hands over the next uncollected tile from it */
function awardPageTile(pid){
  const p = page(pid); if(!p||!p.tiles) return null;
  const next = p.tiles.find(t=>!S.tiles.includes(t.id));
  if(next){ collectTile(next.id); return next.id; }
  return null;
}

  slot.querySelector('.lab')?.remove();

    title:'Chip earned here'}, el('i',{class:'edge'}));

function renderRail(){

      el('b',{},'  ['+t.cite+']')));
  track.append(...make(), ...make());   /* doubled for seamless roll */
}

/* ============================================================
   CR MATCHER
   Student prose is scored by content-word overlap against the
   accepted list and the rejected list. Highest container wins.
   Wrong -> we hand back the rejected entry it matched.
   ============================================================ */
const STOP = new Set(('a an the and or but of to in on at for from by with as is are was were '+
  'be been being it its this that these those he she they them his her their i you we '+
  'not no so if then than because about into over under out up down what which who whom '+
  'how why when where do does did done have has had will would can could should there '+
  'one two both each other same more most very just also only').split(' '));
const toks = s => String(s||'').toLowerCase()
  .replace(/[^a-z0-9\s']/g,' ').split(/\s+/)
  .filter(w=>w.length>2 && !STOP.has(w));

function overlap(a,b){
  const A=new Set(toks(a)), B=toks(b);
  if(!A.size||!B.length) return 0;
  const hit = B.filter(w=>A.has(w)).length;
  return hit / Math.min(A.size, B.length);   /* containment, not Jaccard */
}
function judgeCR(text, node){
  const words = toks(text).length;
  let best={score:0,entry:null,list:null};
  (node.accepted||[]).forEach(e=>{ const s=overlap(text,e);
    if(s>best.score) best={score:s,entry:e,list:'accepted'}; });
  (node.rejected||[]).forEach(e=>{ const s=overlap(text,e);
    if(s>best.score) best={score:s,entry:e,list:'rejected'}; });
  /* thin answers can't be credited no matter what they echo */
  const floor = node.kind==='CR4' ? 45 : node.kind==='CR1' ? 12 : 20;
  if(words < floor) return {correct:false, why:'short', need:floor, words};
  if(best.list==='rejected' && best.score>=.34)
    return {correct:false, why:'rejected', entry:best.entry};
  if(best.list==='accepted' && best.score>=.22)
    return {correct:true, entry:best.entry};
  return {correct:false, why:'unmatched'};
}

/* ============================================================
   BINDS — what a wrong answer does
   ============================================================ */
function followBind(node){
  const b = node.binds;
  if(!b) return;
  const nums = String(b).match(/\d+/g);
  if(!nums) return;
  const first = nums[0];
  const p = $(`.prose p[data-para="${first}"]`);
  if(!p) return;
  p.scrollIntoView({behavior:'smooth',block:'center'});
  nums.forEach(n=>{
    const t = $(`.prose p[data-para="${n}"]`);
    if(t){ t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
  });
}

/* ============================================================
   NODE RENDERERS
   Item forms are printed verbatim. Only the frame is designed.
   ============================================================ */
let QNO = 0;

function renderNode(node, pid, opts={}){
  QNO++;
  const rec = S.answers[node.id];
  const loud = page(pid)?.mode === 'loud';
  const host = el('article',{class:'node'+(loud?' pulse':''), id:'n-'+node.id,
    'data-node':node.id});

  const lanes = node.lanes||{};
  host.append(el('div',{class:'qno'},
    'Question ' + QNO,
    node.points ? ' · ' + node.points + (node.points>1?' credits':' credit') : '',
    lanes.standard ? ' · ' + lanes.standard : '',
    node.game==='arcade' ? ' · arcade' : '',
    node.game==='review' ? ' · review' : ''
  ));

  if(node.kind==='MC')      renderMC(host,node,rec,opts);
  else if(node.kind==='write') renderWrite(host,node,rec);
  else                      renderCR(host,node,rec);

  if(node.game==='chip'){
    const slot = el('div',{class:'chip-slot'},
      el('span',{class:'lab'},'chip lands here'));
    host.append(slot);
    if(S.chips.includes(node.id)){
      slot.querySelector('.lab').remove();
      slot.append(el('div',{class:'chip','data-r':'rare'},el('i',{class:'edge'})));
    }
  }
  if(node.links && node.links.length){
    host.append(el('div',{class:'credit-line'},'See also: ',
      ...node.links.map(l=>el('span',{class:'wikilink',
        onclick:()=>jumpToNode(l)}, l+' '))));
  }
  if(rec) host.classList.add('answered');
  if(rec && rec.correct) host.classList.add('correct');
  return host;
}

/* A wiki link may name a node, a tile, a synth card, or a mini-exam
   item. Same artist only — every id in this file already is. */
function jumpToNode(ref){
  const nid = String(ref).split('/')[0].trim();
  if(nodeById[nid]){
    location.hash = nodeById[nid].page;
    setTimeout(()=>{
      const t = document.getElementById('n-'+nid);
      if(!t) return;
      t.scrollIntoView({behavior:'smooth',block:'center'});
      t.classList.add('correct');
      setTimeout(()=>{ if(!S.answers[nid]) t.classList.remove('correct'); },1500);
    },90);
    return;
  }
  if(allTiles[nid]){
    const t = allTiles[nid];
    location.hash = nid.slice(0,2);
    setTimeout(()=>toast(
      S.tiles.includes(nid) ? t.claim
        : nid+' — you have not collected this tile yet.'), 140);
    return;
  }
  if(synthById[nid]){
    location.hash = synthById[nid].page;
    setTimeout(()=>toast(S.synth.includes(nid)
      ? 'Synthesis card '+nid+' — you already found it.'
      : 'Something on this page is hidden. Look at the captions.'),140);
    return;
  }
  if(nid.startsWith('p6-mx')){
    location.hash = 'p6';
    setTimeout(()=>toast('That one is on the mini-exam.'),140);
    return;
  }
  toast('That link points nowhere: '+nid);
}

function renderMC(host,node,rec,opts){
  host.append(el('p',{class:'stem'},node.stem));
  const list = el('div',{class:'opts'});
  const letters = ['A','B','C','D'];
  node.options.forEach((optText,i)=>{
    const letter = letters[i];
    const b = el('button',{type:'button'},optText);
    b.dataset.letter = letter;
    list.append(b);
    b.addEventListener('click',()=>answerMC(host,node,letter,b));
  });
  host.append(list);
  host.append(el('div',{class:'fb'}));
  if(rec) paintMC(host,node,rec);
}

function paintMC(host,node,rec){
  const btns = $$('.opts button',host);
  btns.forEach(b=>{
    b.disabled = true;
    if(b.dataset.letter===rec.value)
      b.classList.add(rec.correct?'picked-right':'picked-wrong');
    /* review nodes hand the answer back on a miss. quietly. */
    if(!rec.correct && node.game==='review' && b.dataset.letter===node.key)
      b.classList.add('was-right');
  });
  const fb = $('.fb',host); fb.innerHTML='';
  if(rec.correct) return;
  if(node.game==='arcade') return;            /* lives-capped, no reveal */
  const bits = [];
  if(node.game==='review') bits.push('The correct answer is marked.');
  const trace = (node.distractor_trace||{})[rec.value];
  if(trace) bits.push(trace);
  if(node.binds) bits.push('Go back to ' + node.binds + '.');
  if(bits.length) fb.append(el('div',{class:'feedback'},
    el('h4',{},'Look again'), ...bits.map(t=>el('p',{style:'margin:0 0 6px'},t))));
}

function answerMC(host,node,letter,btn){
  if(S.answers[node.id]) return;
  const correct = letter === node.key;
  S.answers[node.id] = {correct, value:letter, at:Date.now()};
  save();
  host.classList.remove('pulse');
  host.classList.add('answered');
  paintMC(host,node,S.answers[node.id]);
  if(correct){
    host.classList.add('correct');
    burst(btn);
    if(node.game==='chip') dropChip(node.id,host);
    awardPageTile(node.page || host.closest('[data-pid]')?.dataset.pid);
  }else{
    followBind(node);
  }
  afterAnswer(node);
}

function renderCR(host,node,rec){
  host.classList.add('cr');
  host.append(el('p',{class:'stem'},node.stem));
  if(node.be_sure_to && node.be_sure_to.length){
    host.append(el('p',{style:'margin:0 0 6px'},'In your response, be sure to'));
    host.append(el('ul',{style:'margin:0 0 14px'},
      ...node.be_sure_to.map(b=>el('li',{},b))));
  }
  if(node.definitions_printed && node.definitions_printed.length){
    host.append(el('div',{class:'defbox'},
      ...node.definitions_printed.map(d=>el('p',{},d))));
  }
  const ta = el('textarea',{placeholder:'Write your response in complete sentences.',
    'aria-label':'Your response'});
  if(rec) { ta.value = rec.value||''; ta.disabled = true; }
  host.append(ta);
  host.append(el('div',{class:'credit-line'},
    'Score box: ____ / ' + (node.points||1)));
  const fb = el('div',{class:'fb'});
  const btn = el('button',{class:'btn btn-accent',
    onclick:()=>submitCR(host,node,ta,btn)}, rec?'Submitted':'Submit');
  if(rec) btn.disabled = true;
  host.append(el('div',{class:'actions'},btn),fb);
  if(rec) paintCR(host,node,rec);
}

function paintCR(host,node,rec){
  const fb = $('.fb',host); fb.innerHTML='';
  if(rec.correct){
    fb.append(el('div',{class:'feedback'},
      el('h4',{},'Credited'),
      el('p',{style:'margin:0'},'Your response lines up with an accepted answer.')));
    return;
  }
  const box = el('div',{class:'feedback'},el('h4',{},'Not yet credited'));
  if(rec.why==='short')
    box.append(el('p',{style:'margin:0 0 8px'},
      `That is ${rec.words} content words. This item needs a fuller response — claim plus details.`));
  else if(rec.why==='rejected')
    box.append(el('p',{style:'margin:0 0 8px'},
      'Your response matched this entry on the rejected list:'),
      el('p',{style:'margin:0 0 8px;font-style:italic'},'“'+rec.entry+'”'));
  else
    box.append(el('p',{style:'margin:0 0 8px'},
      'Your response did not reach an accepted answer. Bring in two details from the text.'));
  if(node.accepted && node.accepted.length){
    box.append(el('h4',{},'Accepted responses include'));
    box.append(el('ul',{},...node.accepted.slice(0,4).map(a=>el('li',{},a))));
  }
  fb.append(box);
}

function submitCR(host,node,ta,btn){
  if(S.answers[node.id]) return;
  const text = ta.value.trim();
  if(!text){ toast('Write something first.'); return; }
  const j = judgeCR(text,node);
  S.answers[node.id] = Object.assign({value:text, at:Date.now()}, j);
  save();
  ta.disabled = true; btn.disabled = true; btn.textContent='Submitted';
  host.classList.remove('pulse'); host.classList.add('answered');
  paintCR(host,node,S.answers[node.id]);
  if(j.correct){
    host.classList.add('correct'); burst(btn);
    awardPageTile(node.page || host.closest('[data-pid]')?.dataset.pid);
  }
  afterAnswer(node);
}

function renderWrite(host,node,rec){
  host.classList.add('cr');
  host.append(el('p',{class:'stem'},node.stem||'Write the next paragraph of the story.'));
  host.append(el('p',{class:'credit-line'},
    'Ungraded. What you write here becomes a fragment for the essay builder.'));
  const ta = el('textarea',{placeholder:'Your paragraph.'});
  if(rec){ ta.value = rec.value||''; }
  host.append(ta);
  const btn = el('button',{class:'btn btn-accent'}, rec?'Saved':'Save paragraph');
  btn.addEventListener('click',()=>{
    const t = ta.value.trim();
    if(t.length<40){ toast('Give it at least a couple of sentences.'); return; }
    S.answers[node.id] = {correct:true, value:t, at:Date.now()};
    save();
    host.classList.remove('pulse'); host.classList.add('answered','correct');
    btn.textContent='Saved'; burst(btn);
    awardPageTile(node.page);
    afterAnswer(node);
  });
  host.append(el('div',{class:'actions'},btn));
}

function afterAnswer(node){
  renderNav();
  const pid = node.page;
  const banner = $('#done-'+pid);
  const [d,t] = pageProgress(pid);
  const bar = $('#bar-'+pid);
  if(bar){ bar.style.width = (t?d/t*100:0)+'%'; }
  const cnt = $('#cnt-'+pid);
  if(cnt) cnt.textContent = d+' of '+t+' answered';
  if(banner && pageDone(pid)) banner.classList.remove('hidden');
}

/* ============================================================
   IMAGE MAP
   Slot id -> file in images/. Missing files render as labelled
   empty frames; nothing breaks, and the gap is visible on purpose.
   ============================================================ */
const FILES = {
  'p2-img1':'p2-img1-cobain-novoselic-vmas1992.jpg',
  'p2-img2':'p2-img2-bleach-album-1989.png',
  'p2-img3':'p2-img3-kurt-cobain-portrait.jpg',
  'p2-img4':'p2-img4-mopop-vma-trophy.jpg',
  'p2-img5':'p2-img5-band-photo.jpg',
  'D1':'d1-visual.jpg',
  'D4':'nirvana-last-setlist.jpg',
  'splash':'splash-hero.jpg'
};
const CARD_BACKS = ['card-back-nevermind.jpg','card-back-bleach.jpg',
                    'card-back-in-utero.jpg'];

function figure(slotId, caption, source, extraClass){
  const file = FILES[slotId];
  const fig = el('figure',{class:'fig '+(extraClass||'')});
  if(file){
    const img = el('img',{src:IMG+file, alt:caption||slotId, loading:'lazy'});
    img.addEventListener('error',()=>{
      fig.classList.add('empty');
      img.replaceWith(el('div',{class:'ph'},
        el('span',{},'IMAGE SLOT '+slotId+' — file not in images/ yet')));
    });
    fig.append(img);
  }else{
    fig.classList.add('empty');
    fig.append(el('div',{class:'ph'},
      el('span',{},'IMAGE SLOT '+slotId+' — awaiting manifest')));
  }
  if(caption) fig.append(el('figcaption',{},caption,
    source?el('div',{class:'source-line'},source):null));
  else if(source) fig.append(el('figcaption',{},
    el('div',{class:'source-line'},source)));
  return fig;
}

/* ============================================================
   SHARED BLOCKS
   ============================================================ */
function readBlock(p){
  const r = p.read; if(!r) return null;
  const box = el('div',{});
  if(r.setup)  box.append(el('p',{class:'setup'},r.setup));
  if(r.title)  box.append(el('h2',{class:'flyer flyer-l',
    style:'margin:0 0 10px'},r.title));
  if(r.label)  box.append(el('p',{class:'label-line'},r.label));
  if(r.instruction) box.append(el('p',{class:'instruction'},r.instruction));

  const prose = el('div',{class:'prose'});
  if(r.paragraphs) r.paragraphs.forEach((t,i)=>
    prose.append(el('p',{'data-para':String(i+1)},t)));
  if(r.blocks) r.blocks.forEach(b=>{
    const para = el('p',{'data-para':String(b.n)},b.text);
    if(b.cites && b.cites.length)
      para.append(el('span',{class:'source-line',
        style:'display:inline;margin-left:6px'},'['+b.cites.join(', ')+']'));
    prose.append(para);
  });
  box.append(prose);

  if(r.footnotes && r.footnotes.length)
    box.append(el('div',{class:'footnotes'},
      el('div',{class:'kicker',style:'margin-bottom:7px'},'Vocabulary'),
      el('ul',{style:'margin:0;padding-left:18px;list-style:none'},
        ...r.footnotes.map(f=>el('li',{},f)))));

  const meta = [];
  if(r.words) meta.push(r.words+' words');
  if(r.lexile_target) meta.push('Lexile target '+r.lexile_target.join('–')+'L');
  if(r.citation) meta.push(r.citation);
  if(r.rights) meta.push('Rights: '+r.rights);
  if(meta.length) box.append(el('p',{class:'source-line'},meta.join(' · ')));
  return box;
}

function docBlock(doc){
  if(!doc) return null;
  const box = el('div',{class:'card-box'});
  box.append(el('div',{class:'kicker',style:'margin-bottom:8px'},
    doc.id + ' — ' + doc.kind));
  if(doc.setup) box.append(el('p',{class:'setup'},doc.setup));

  if(doc.kind==='timeline' && doc.entries){
    box.append(el('ul',{class:'timeline'},...doc.entries.map(e=>
      el('li',{}, el('div',{class:'d'},e.date), el('div',{},e.event),
        e.cite?el('div',{class:'source-line'},'['+e.cite+']'):null))));
  }else if(doc.kind==='lyric' && doc.lines){
    box.append(el('pre',{class:'lyric'},doc.lines.join('\n')));
  }else if(doc.kind==='visual'){
    box.append(figure(doc.id, doc.caption, doc.source));
  }else if(doc.text){
    box.append(el('div',{class:'prose'},
      ...String(doc.text).split(/\n\n+/).map((t,i)=>
        el('p',{'data-para':String(i+1)},t))));
  }
  if(doc.caption && doc.kind!=='visual')
    box.append(el('p',{class:'source-line'},doc.caption));
  if(doc.source && doc.kind!=='visual')
    box.append(el('p',{class:'source-line'},doc.source));
  if(doc.words) box.append(el('p',{class:'source-line'},doc.words+' words'));
  return box;
}

function brollRail(p){
  const rail = el('aside',{class:'broll'});
  const strip = el('div',{class:'strip'});
  const perfs = () => el('div',{class:'perfs'},
    ...Array.from({length:4},()=>el('i',{})));
  strip.append(perfs());
  /* three frames visible, per spec */
  const slots = [];
  if(p.doc && p.doc.border==='b-roll') slots.push([p.doc.id, p.doc.caption]);
  (p.docs||[]).forEach(d=>{ if(d.border==='b-roll') slots.push([d.id,d.caption]); });
  (p.media||[]).slice(0,3).forEach(m=>slots.push([m.slot,m.caption]));
  while(slots.length<3) slots.push([null,null]);

  slots.slice(0,3).forEach(([id])=>{
    const f = el('div',{class:'frame'});
    const file = id && FILES[id];
    if(file){
      const img = el('img',{src:IMG+file, alt:id, loading:'lazy'});
      img.addEventListener('error',()=>{
        f.classList.add('empty');
        img.replaceWith(el('span',{},(id||'—')+' pending'));
      });
      f.append(img);
    }else{
      f.classList.add('empty');
      f.append(el('span',{},(id||'frame')+' pending'));
    }
    strip.append(f);
  });
  strip.append(perfs());
  rail.append(strip);
  const src = (p.doc && p.doc.source) ||
              (p.docs||[]).find(d=>d.border==='b-roll')?.source;
  rail.append(el('div',{class:'cap'},
    (p.doc?.caption || 'B-roll'), src?el('div',{style:'margin-top:5px'},src):null));
  return rail;
}

/* synth card — a caption on a picture. no hover state. */
function synthCaption(syn){
  if(!syn) return null;
  const found = S.synth.includes(syn.id);
  const wrap = el('div',{});
  const cap = el('div',{class:'source-line synth-cap'+(found?' found':''),
    role:'button', tabindex:'0'},
    found ? 'Photograph, source unestablished. — you found this one'
          : 'Photograph, source unestablished.');
  const panel = el('div',{class:'synth-panel'+(found?'':' hidden')});
  panel.append(el('p',{class:'ask'},syn.ask));
  if(found){
    const t = allTiles[syn.pair];
    panel.append(el('div',{class:'kicker',style:'margin-bottom:6px'},
      'Paired tile — '+syn.pair));
    panel.append(el('p',{style:'margin:0'}, t?t.claim:'(tile not found)'));
  }
  const open = ()=>{
    if(!S.synth.includes(syn.id)){
      S.synth.push(syn.id); collectTile(syn.pair); save();
      cap.classList.add('found');
      cap.textContent='Photograph, source unestablished. — you found this one';
      const t = allTiles[syn.pair];
      panel.append(el('div',{class:'kicker',style:'margin:11px 0 6px'},
        'Paired tile — '+syn.pair));
      panel.append(el('p',{style:'margin:0'}, t?t.claim:'(tile not found)'));
      toast('Hidden synthesis card — rarest');
      burst(cap);
    }
    panel.classList.toggle('hidden');
  };
  cap.addEventListener('click',open);
  cap.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' ')
    { e.preventDefault(); open(); }});
  wrap.append(cap,panel);
  return wrap;
}

/* card stacks — dealt as a pile, click to flip */
function stackBlock(st,idx){
  const wrap = el('div',{});
  wrap.append(el('div',{class:'kicker',style:'margin-bottom:9px'},
    'Card stack — '+st.tiles.length+' cards. Use these to refocus.'));
  const stack = el('div',{class:'stack'});
  const back = CARD_BACKS[idx % CARD_BACKS.length];
  st.tiles.slice().reverse().forEach((tid,i)=>{
    const t = allTiles[tid]; if(!t) return;
    const depth = st.tiles.length - 1 - i;
    const card = el('div',{class:'card'});
    card.style.transform =
      `translate(${depth*3}px,${-depth*3}px) rotate(${(depth%2?-1:1)*depth*.8}deg)`;
    card.style.zIndex = String(10+i);
    const bk = el('div',{class:'face back'},
      el('div',{class:'mark'},'Nirvana'));
    bk.style.backgroundImage = `url(${IMG}${back})`;
    const fr = el('div',{class:'face front'},
      el('p',{style:'margin:0 0 9px;font-size:14.5px;line-height:1.5'},t.claim),
      el('div',{class:'source-line'},'['+t.cite+'] · '+t.rarity));
    card.append(bk,fr);
    card.addEventListener('click',()=>{
      card.classList.toggle('flipped');
      if(card.classList.contains('flipped')) collectTile(tid);
    });
    stack.append(card);
  });
  stack.append(el('div',{class:'hint'},'Click a card to turn it over'));
  wrap.append(stack);
  return wrap;
}

function tileGrid(p){
  if(!p.tiles || !p.tiles.length) return null;
  const wrap = el('div',{});
  wrap.append(el('div',{class:'kicker',style:'margin-bottom:9px'},
    'Fact tiles — ' + p.tiles.filter(t=>S.tiles.includes(t.id)).length +
    ' of ' + p.tiles.length + ' collected'));
  const grid = el('div',{style:'display:grid;gap:9px'});
  p.tiles.forEach(t=>{
    const got = S.tiles.includes(t.id);
    grid.append(el('div',{class:'tile'+(got?'':' locked'),'data-r':t.rarity},
      el('p',{class:'claim'}, got ? t.claim : 'Not collected yet.'),
      el('div',{class:'meta'}, el('span',{},t.rarity),
        el('span',{}, got ? '['+t.cite+']' : t.id))));
  });
  wrap.append(grid);
  return wrap;
}

function calmPage(pid){
  QNO = 0;
  const p = page(pid);
  const sec = el('section',{class:'page','data-pid':pid});
  const shell = el('div',{class:'calm-shell'});
  const col = el('div',{});

  col.append(pageHead(p));
  col.append(doneBanner(p));

  const rb = readBlock(p);
  if(rb) col.append(rb);

  /* page 4 and 5 print their documents in the column */
  (p.docs||[]).forEach(d=>{
    if(d.border==='b-roll') return;            /* that one lives in the rail */
    col.append(el('div',{style:'margin:26px 0'}, docBlock(d)));
  });
  if(p.doc && p.doc.border!=='b-roll')
    col.append(el('div',{style:'margin:26px 0'}, docBlock(p.doc)));

  /* definition boxes, printed as the Regents prints them */
  if(p.definitions && p.definitions.length){
    col.append(el('div',{class:'kicker',style:'margin:26px 0 9px'},
      'Definitions'));
    col.append(el('div',{class:'defbox'},
      ...p.definitions.map(d=>el('p',{},d))));
  }

  /* the synth card hides as a caption under a picture */
  const syn = (p.synth||[])[0];
  if(syn){
    col.append(el('div',{style:'margin:30px 0'},
      figure((p.docs||[]).find(d=>d.kind==='visual')?.id || 'D1', null, null),
      synthCaption(Object.assign({page:pid},syn))));

  col.append(el('div',{class:'kicker',style:'margin:34px 0 12px'},'Questions'));
  allNodes(p).forEach(n=>col.append(renderNode(Object.assign({page:pid},n),pid)));

  const tg = tileGrid(p);
  if(tg) col.append(el('div',{style:'margin-top:34px'},tg));

  shell.append(col, brollRail(p));
  sec.append(shell);
  return sec;
}

/* ============================================================
   PAGE 3 — FORCE-DIRECTED NODE/EDGE GAME
   Tiles are nodes. Drag one onto another to propose an edge,
   then pick a relation. Two model edges are pre-drawn.
   ============================================================ */
const REL_COLOR = {'cause':'#D98A2B','effect':'#2E7DA8',
                   'contrast':'#A8332A','same event':'#7E8A3C'};

function graphBlock(p){
  const g = p.graph;
  const wrap = el('div',{id:'graph-wrap'});
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('id','graph');
  svg.setAttribute('viewBox','0 0 900 520');
  wrap.append(svg);

  const W=900,H=520;
  const ids = g.nodes.slice();
  const P = {};                                   /* physics bodies */
  ids.forEach((id,i)=>{
    const a = (i/ids.length)*Math.PI*2;
    P[id] = {id, x:W/2+Math.cos(a)*210+(Math.random()*20-10),
                  y:H/2+Math.sin(a)*175+(Math.random()*20-10),
                  vx:0, vy:0, fixed:false};
  });

  const gEdges = document.createElementNS(NS,'g');
  const gNodes = document.createElementNS(NS,'g');
  svg.append(gEdges,gNodes);

  const modelEdges = (g.model_edges||[]).map(e=>Object.assign({model:true},e));
  const edges = () => modelEdges.concat(S.edges);

  /* ---- draw ---- */
  const lineEls = new Map();
  function drawEdges(){
    gEdges.innerHTML='';
    lineEls.clear();
    edges().forEach((e,i)=>{
      const a=P[e.from], b=P[e.to]; if(!a||!b) return;
      const ln = document.createElementNS(NS,'line');
      ln.setAttribute('stroke', REL_COLOR[e.relation]||'#8A857C');
      ln.setAttribute('stroke-width', e.model?3:2);
      if(!e.model) ln.setAttribute('stroke-dasharray','6 4');
      ln.setAttribute('opacity','.85');
      gEdges.append(ln);
      lineEls.set(i,{ln,e});
      const mid = document.createElementNS(NS,'text');
      mid.setAttribute('fill', REL_COLOR[e.relation]||'#8A857C');
      mid.setAttribute('font-size','10');
      mid.setAttribute('font-family','ui-monospace,Menlo,monospace');
      mid.setAttribute('text-anchor','middle');
      mid.textContent = e.relation;
      gEdges.append(mid);
      lineEls.get(i).mid = mid;
    });
  }

  const nodeEls = {};
  function drawNodes(){
    gNodes.innerHTML='';
    ids.forEach(id=>{
      const t = allTiles[id];
      const got = S.tiles.includes(id);
      const grp = document.createElementNS(NS,'g');
      grp.setAttribute('class','gnode');
      grp.dataset.id = id;
      const c = document.createElementNS(NS,'circle');
      c.setAttribute('r','21');
      c.setAttribute('fill', got ? '#2A2620' : '#1A1714');
      c.setAttribute('stroke', got
        ? (t && {common:'#8A857C',uncommon:'#2E7DA8',rare:'#D98A2B',
                 rarest:'#B0347A'}[t.rarity]) || '#8A857C'
        : '#3A342C');
      c.setAttribute('stroke-width','2');
      const tx = document.createElementNS(NS,'text');
      tx.setAttribute('text-anchor','middle');
      tx.setAttribute('dy','4');
      tx.setAttribute('font-size','9.5');
      tx.setAttribute('font-family','ui-monospace,Menlo,monospace');
      tx.setAttribute('fill', got?'#EDE7DA':'#6E6459');
      tx.setAttribute('pointer-events','none');
      tx.textContent = id.replace('-tile','·');
      const ti = document.createElementNS(NS,'title');
      ti.textContent = got ? (t?t.claim:id)
        : id + ' — collect this tile first (Page ' + id[1] + ')';
      grp.append(c,tx,ti);
      gNodes.append(grp);
      nodeEls[id] = grp;
    });
  }

  function position(){
    edges().forEach((e,i)=>{
      const rec = lineEls.get(i); if(!rec) return;
      const a=P[e.from], b=P[e.to]; if(!a||!b) return;
      rec.ln.setAttribute('x1',a.x); rec.ln.setAttribute('y1',a.y);
      rec.ln.setAttribute('x2',b.x); rec.ln.setAttribute('y2',b.y);
      rec.mid.setAttribute('x',(a.x+b.x)/2);
      rec.mid.setAttribute('y',(a.y+b.y)/2 - 5);
    });
    ids.forEach(id=>{
      const n=P[id];
      nodeEls[id]?.setAttribute('transform',`translate(${n.x},${n.y})`);
    });
  }

  /* ---- physics ---- */
  let frames = 0, raf = null;
  function step(){
    frames++;
    ids.forEach(a=>{
      const A=P[a]; if(A.fixed) return;
      ids.forEach(b=>{
        if(a===b) return;
        const B=P[b];
        let dx=A.x-B.x, dy=A.y-B.y;
        let d2 = dx*dx+dy*dy || .01;
        if(d2 < 40000){                       /* repulsion */
          const f = 2600/d2;
          A.vx += dx*f*.01; A.vy += dy*f*.01;
        }
      });
      /* pull to centre */
      A.vx += (W/2-A.x)*.0016;
      A.vy += (H/2-A.y)*.0016;
    });
    edges().forEach(e=>{                      /* springs */
      const a=P[e.from], b=P[e.to]; if(!a||!b) return;
      const dx=b.x-a.x, dy=b.y-a.y;
      const d = Math.hypot(dx,dy)||.01;
      const f = (d-165)*.006;
      if(!a.fixed){ a.vx += dx/d*f; a.vy += dy/d*f; }
      if(!b.fixed){ b.vx -= dx/d*f; b.vy -= dy/d*f; }
    });
    ids.forEach(id=>{
      const n=P[id]; if(n.fixed) return;
      n.vx*=.84; n.vy*=.84;
      n.x=Math.max(28,Math.min(W-28,n.x+n.vx));
      n.y=Math.max(28,Math.min(H-28,n.y+n.vy));
    });
    position();
    if(frames < 900) raf = requestAnimationFrame(step);
  }

  /* ---- drag to connect ---- */
  let drag=null;
  function toSvg(ev){
    const r = svg.getBoundingClientRect();
    return {x:(ev.clientX-r.left)/r.width*W, y:(ev.clientY-r.top)/r.height*H};
  }
  svg.addEventListener('pointerdown',ev=>{
    const grp = ev.target.closest('.gnode'); if(!grp) return;
    const id = grp.dataset.id;
    if(!S.tiles.includes(id)){
      toast('Collect '+id+' first — it is on Page '+id[1]+'.'); return; }
    drag = {id, moved:false};
    P[id].fixed = true;
    grp.classList.add('dragging');
    svg.setPointerCapture(ev.pointerId);
    frames = 0; if(!raf) raf = requestAnimationFrame(step);
  });
  svg.addEventListener('pointermove',ev=>{
    if(!drag) return;
    const pt = toSvg(ev);
    P[drag.id].x = pt.x; P[drag.id].y = pt.y;
    drag.moved = true;
    position();
  });
  svg.addEventListener('pointerup',ev=>{
    if(!drag) return;
    const me = drag; drag = null;
    nodeEls[me.id]?.classList.remove('dragging');
    P[me.id].fixed = false;
    if(!me.moved) return;
    /* did we land on another node? */
    const target = ids.find(id=>{
      if(id===me.id) return false;
      return Math.hypot(P[id].x-P[me.id].x, P[id].y-P[me.id].y) < 40;
    });
    if(!target) return;
    if(!S.tiles.includes(target)){
      toast('Collect '+target+' first.'); return; }
    if(edges().some(e=>(e.from===me.id&&e.to===target)||
                       (e.from===target&&e.to===me.id))){
      toast('Those two are already connected.'); return; }
    askRelation(wrap, ev, me.id, target, ()=>{ drawEdges(); position();
      frames=0; if(!raf) raf=requestAnimationFrame(step);
      $('#edge-log').replaceWith(edgeLog(p)); });
  });

  drawEdges(); drawNodes(); position();
  raf = requestAnimationFrame(step);
  return wrap;
}

function askRelation(wrap, ev, from, to, done){
  $('#relpick')?.remove();
  const box = el('div',{id:'relpick'});
  const r = wrap.getBoundingClientRect();
  box.style.left = Math.min(r.width-190, Math.max(8, ev.clientX-r.left)) + 'px';
  box.style.top  = Math.min(r.height-190, Math.max(8, ev.clientY-r.top)) + 'px';
  box.append(el('div',{class:'kicker',style:'margin-bottom:5px'},
    from+' → '+to));
  (page('p3').graph.relations||[]).forEach(rel=>{
    box.append(el('button',{onclick:()=>{
      S.edges.push({from,to,relation:rel}); save();
      box.remove(); done();
      toast('Edge drawn: '+rel);
    }},rel));
  });
  box.append(el('button',{onclick:()=>box.remove(),
    style:'opacity:.6'},'cancel'));
  wrap.append(box);
}

function edgeLog(p){
  const box = el('div',{class:'card-box',id:'edge-log'});
  box.append(el('h3',{},'Edges'));
  const log = el('div',{class:'edge-log'});
  (p.graph.model_edges||[]).forEach(e=>{
    log.append(el('div',{class:'model',style:'margin-bottom:11px'},
      el('div',{},'▸ '+e.from+' → '+e.to+' — '+e.relation+' (model)'),
      el('div',{style:'opacity:.8;margin-top:3px'},e.reasoning)));
  });
  if(!S.edges.length)
    log.append(el('div',{style:'opacity:.65'},'You have not drawn any yet.'));
  S.edges.forEach((e,i)=>{
    log.append(el('div',{style:'margin-bottom:7px;display:flex;gap:8px'},
      el('span',{style:'flex:1'},'▸ '+e.from+' → '+e.to+' — '+e.relation),
      el('button',{title:'remove',style:'opacity:.6',onclick:()=>{
        S.edges.splice(i,1); save();
        $('#edge-log').replaceWith(edgeLog(p));
      }},'×')));
  });
  box.append(log);
  return box;
}

/* ============================================================
   TILE -> MC
   The rote pool is a list of tile ids. Each becomes a cloze:
   a salient span is blanked out of the claim and three spans of
   the same type are pulled from other tiles as distractors.
   ============================================================ */
function seeded(str){ let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ()=>{ h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0; return h/4294967296; };
}
const YEAR = /\b(?:19|20)\d{2}\b/g;
const PROP = /\b(?:[A-Z][a-z]+(?:\s+[A-Z][a-z]+)*)\b/g;
const NUM  = /\b(?:number\s+one|\d[\d,]*(?:st|nd|rd|th)?)\b/gi;

function spansOf(claim){
  const y = claim.match(YEAR)||[];
  const p = (claim.match(PROP)||[]).filter(s=>s.length>3 &&
    !/^(The|This|That|A|An|On|In|By|Before|After|When|What|Nirvana)$/.test(s));
  const n = (claim.match(NUM)||[]).filter(s=>!/^(?:19|20)\d{2}$/.test(s));
  return {year:y, prop:p, num:n};
}
function makeTileMC(tileId){
  const t = allTiles[tileId]; if(!t) return null;
  const rnd = seeded(tileId);
  const sp = spansOf(t.claim);
  const order = ['year','prop','num'].filter(k=>sp[k].length);
  if(!order.length) return null;
  const kind = order[0];
  const answer = sp[kind][Math.floor(rnd()*sp[kind].length)];

  const pool = [];
  tileList.forEach(o=>{
    if(o.id===tileId) return;
    spansOf(o.claim)[kind].forEach(s=>{ if(s!==answer) pool.push(s); });
  });
  const uniq = [...new Set(pool)];
  const picks = [];
  while(picks.length<3 && uniq.length){
    picks.push(uniq.splice(Math.floor(rnd()*uniq.length),1)[0]);
  }
  while(picks.length<3) picks.push('—');

  const opts = [answer,...picks];
  for(let i=opts.length-1;i>0;i--){                  /* shuffle */
    const j = Math.floor(rnd()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]];
  }
  const letters=['A','B','C','D'];
  return {
    id:'rote-'+tileId, tile:tileId, rarity:t.rarity, cite:t.cite,
    stem: t.claim.replace(answer,'________'),
    options: opts.map((o,i)=>letters[i]+'. '+o),
    key: letters[opts.indexOf(answer)],
    full: t.claim
  };
}
const ROTE = (page('p6').game.rote_pool||[])
  .map(makeTileMC).filter(Boolean);
