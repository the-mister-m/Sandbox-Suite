<script id="canvas-data" type="application/json">{"artist":"nirvana","schema":"canvas-v1","built":"2026-09-01","db":{"facts":["artist","slice","id","claim","source","locator","quote","voice","topic"],"passages":["artist","slice","id","file","heading","lines","gloss","topic","url"],"gaps":["no media table","no rights column"],"rights":"unverified","note":"source is a pull-file path, not a publication. voice is the real speaker. Rarity counted on distinct source files, per spec."},"rarity":{"common":"3+ source rows","uncommon":"2 source rows","rare":"1 row or artist-voice only","rarest":"hidden synthesis cards"},"pages":[{"id":"p1","title":"narrative","mode":"calm","read":{"kind":"historical fiction","words":812,"lexile_target":[950,1050],"setup":"In this story, a teenager in a small Washington logging town spends more than a year deciding whether to answer a question a friend keeps asking him.","label":"HISTORICAL FICTION — built from facts [01-001, 01-002, 01-006, 01-007, 01-008, 01-010, 01-011, 01-012, 01-234, 01-235, 01-300]","factset":["01-001","01-002","01-006","01-007","01-008","01-010","01-011","01-012","01-234","01-235","01-300"],"instruction":"Read this story. Then answer questions 1 through 9.","paragraphs":["The rain in Aberdeen did not fall so much as settle. It came down thin and gray and constant, and it made the whole town look like a photograph somebody had left out in the weather. Krist Novoselic had been born a long way from that rain, in Compton, California, in 1965, to a mother and father who had come to America from Croatia and who still spoke Croatian at the kitchen table. In 1979, when he was fourteen, the family moved north to a logging town in Washington where the mills were shrinking and the young people mostly talked about leaving.","He did leave, though not in the way he had imagined. In 1980 his parents sent him across an ocean to live with relatives in Zadar, on the Croatian coast, and for a year he was the American cousin — the tall one, the one who mispronounced things. He came back to Aberdeen in 1981, taller still and quieter, and the town had not changed at all, which was somehow the worst part.","What Aberdeen had, instead of anything to do, was a garage at the edge of town where a band called the Melvins practiced. The Melvins were loud in a way that felt structural, as though the walls were being tested rather than decorated. Kids gathered outside to listen because listening was free and because there was nothing else.","Kurt was one of the ones who hung around. He was small and watchful and he did not waste words, and when he did speak it was usually about music or about something he found funny that nobody else had noticed. He and Krist recognized each other the way two people recognize each other in a small place: not as friends, exactly, but as two people who were clearly not going to fit.","Then one afternoon Kurt handed Krist a cassette. It was a demo1 from a project he had been calling Fecal Matter, recorded in whatever room had been available. Listen to it, Kurt said. Then let's start a band.","Krist said he would listen. He did not say yes. Those were two different sentences and both of them knew it.","The tape sat on a shelf. It sat there through the winter and into the spring. Krist was working, and the work was steady, and the thing about steady work in a town like Aberdeen was that it made the future feel like something that happened to other people in other places. A cassette on a shelf was a decision he could keep not making.","When he finally played it, the tape did not sound professional and it did not sound like anything on the radio. What it sounded like was somebody who meant it. Krist listened to the whole thing standing up, which is not how a person listens to music he does not care about.","The first band they made together was not the band. It was a tribute band2 called the Sellouts that played Creedence Clearwater Revival songs, with Krist on guitar and singing, Kurt on drums, and a friend named Steve Newman on bass. It was, on paper, a reasonable idea. People liked Creedence. People would pay to hear Creedence.","It lasted barely a few weeks. Something in the arrangement was wrong in a way that was hard to name — the instruments were on the wrong people, or the songs were, and playing somebody else's catalog turned out to be a job rather than a reason. The Sellouts came apart and left the two of them standing where they had started.","Kurt kept asking. That is the part of the story that gets left out when people tell it quickly. It was not a night, or a conversation, or a handshake. It was months of asking, month after month, a question repeated to a person who had already said he would think about it.","Early in 1987, Krist said yes.","They found a drummer named Aaron Burckhard and began practicing in the way new bands practice, which is to say they started by playing the Fecal Matter songs off the tape because those songs already existed and existing was the main thing a song had to do. Then, slowly, they stopped playing the old songs and started writing new ones, and the room began producing something that had not been in it before.","Burckhard stayed on drums until October of that year and then he was gone, and the band still did not have a name, and there was no version of the story yet in which any of this was provisional3 rather than simply what was happening. It was a garage, three people, and a tape somebody had almost not listened to."],"footnotes":["1demo: a rough recording made to show what a song or a band sounds like","2tribute band: a band that performs the songs of one other, usually famous, band","3provisional: temporary; standing in place until something more permanent arrives"]},"doc":{"id":"D1","kind":"visual","border":"b-roll","frames":3,"setup":"Photographs from the years before the band had a name.","source":"Source: Wikimedia Commons. Rights unverified.","caption":"","url":"","status":"awaiting media-manifest.json from untitled.2","fallback":"If no free pre-1989 image exists, D1 becomes a table built from facts 01-006, 01-007, 01-008, 01-234, 01-235, 01-002."},"media":[],"tiles":[{"id":"p1-tile1","claim":"Krist Novoselic was born in Compton, California, in 1965, to Croatian immigrant parents.","cite":"01-006","rarity":"rare","skin":"artist","collected":false},{"id":"p1-tile2","claim":"The Novoselic family moved to Aberdeen, Washington, in 1979.","cite":"01-007","rarity":"rare","skin":"artist","collected":false},{"id":"p1-tile3","claim":"In 1980 Novoselic was sent to live with relatives in Zadar, Croatia; he returned to Aberdeen in 1981.","cite":"01-008","rarity":"rare","skin":"artist","collected":false},{"id":"p1-tile4","claim":"Cobain gave Novoselic a demo tape of his former band Fecal Matter and asked him to form a band; Novoselic agreed only after months of asking.","cite":"01-010, 01-300","rarity":"uncommon","skin":"artist","collected":false},{"id":"p1-tile5","claim":"Their first band was the Sellouts, a Creedence Clearwater Revival tribute act with Novoselic on guitar, Cobain on drums, and Steve Newman on bass. It lasted a few weeks.","cite":"01-011, 01-012, 01-234","rarity":"common","skin":"artist","collected":false},{"id":"p1-tile6","claim":"Cobain and Novoselic formed Nirvana in 1987 and recruited drummer Aaron Burckhard, who stayed until October 1987.","cite":"01-002, 01-235","rarity":"uncommon","skin":"artist","collected":false}],"nodes":[{"id":"p1-mc1","kind":"MC","costume":"passage","game":"chip","stem":"Which statement best expresses a theme of the story?","options":["A. A person can spend a long time deciding to change his life, and the deciding is part of the change.","B. Small towns are more difficult to live in than large cities.","C. Musical talent is usually passed down through a person's family.","D. Friendships formed in childhood last longer than friendships formed later."],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"stan 8 — real event, the cause of the turn and not the turn","D":"paragraph 14 — real event, occurs after the turn"},"cites":["01-002","01-300"],"links":[],"answered":false},{"id":"p1-mc6","kind":"MC","costume":"passage","game":"review","stem":"Which detail would be most important to include in a summary of the story?","options":["A. Krist's parents came to the United States from Croatia.","B. The Melvins practiced in a garage at the edge of town.","C. After months of Kurt asking, Krist agreed to form a band, and in early 1987 they recruited a drummer.","D. Krist was taller than most of the people in Aberdeen."],"key":"C","points":1,"lanes":{"type":"MC","key":"C","points":1,"standard":"NGLS.ELA.Content.NY-6R2","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"paragraphs 11-13","distractor_trace":{"A":"paragraph 1 — true, background rather than event","B":"paragraph 3 — true, setting rather than event","D":"paragraph 2 — true, detail rather than event"},"cites":["01-002","01-235","01-300"],"links":[],"answered":false},{"id":"p1-mc7","kind":"MC","costume":"passage","game":"chip","stem":"Read this sentence from paragraph 2. He came back to Aberdeen in 1981, taller still and quieter, and the town had not changed at all, which was somehow the worst part. The sentence mainly shows that the narrator views the town as—","options":["A. dangerous to the people who grow up in it","B. unchanging in a way that wears on the people who live there","C. beautiful, though too poor to keep its young people","D. friendlier than the place Krist had just visited"],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"paragraph 2","distractor_trace":{"A":"paragraph 1, the shrinking mills — real, overstated","C":"paragraph 1, the mills and the leaving — real, wrong relation","D":"paragraph 2, Zadar — real, reversed"},"cites":[],"links":[],"answered":false},{"id":"p1-cr1","kind":"CR2","costume":"passage","game":"none","stem":"This question is worth 2 credits. How do paragraphs 6 through 12 develop Krist as a character? Include your claim and use two details from the story to support your response.","points":2,"lanes":{"type":"CR2","key":"rubric","points":2,"standard":"NGLS.ELA.Content.NY-6R3","strand":"Reading Standards for Literature","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["He is shown as someone who decides slowly, since the tape sits on a shelf through the winter and into the spring before he plays it.","He separates listening from agreeing, saying he would listen but not saying yes, which shows he is careful with what he promises.","His steady work makes the future feel like something that happens to other people, so not deciding is comfortable for him.","He listens to the whole tape standing up, which shows the moment he starts to care.","He does not change his mind because of one conversation; it takes months of Kurt asking.","The failure of the Sellouts does not push him away from Kurt, which shows he is loyal even when a plan does not work.","He is willing to try a reasonable idea first, the tribute band, before trying the risky one.","By paragraph 12 he answers with one short sentence, showing the decision was already made inside him before he said it.","The story gives his hesitation more paragraphs than his agreement, showing that the waiting is the important part of his character.","He is described as quiet after Croatia, and his slowness with the tape matches that quietness."],"rejected":["Krist thinks about the tape for a long time. (restates paragraph 7 without a claim)","Kurt gave Krist a tape and asked him to start a band. (restates paragraph 5)","Krist said yes in 1987. (restates paragraph 12)","The Sellouts were a Creedence tribute band. (restates paragraph 9, not about Krist)","Krist is a good character in the story. (no textual support)"],"fragment":"a decision made slowly, over months of being asked","cites":["01-010","01-300","01-002"],"links":["p5-cr1"],"answered":false},{"id":"p1-write1","kind":"write","costume":"passage","game":"none","stem":"Write the next paragraph of the story.","points":0,"graded":false,"lanes":{"type":"write","key":"ungraded","points":0,"standard":"NGLS.ELA.Content.NY-6W3","strand":"Reading Standards for Literature","subscore":"Writing to Sources","secondary":""},"binds":"","fragment":"[student's own paragraph, carried to the essay builder as written]","cites":[],"links":[],"answered":false}],"synth":[{"id":"p1-syn1","ask":"The story ends with a band that has no name and a drummer who will not stay. What does that suggest about how a movement looks from the inside while it is starting?","pair":"p2-tile1","rarity":"rarest","hidden_as":"caption on a picture","found":false}],"stacks":[],"fail":false,"fail_rule":"<5 corroborated facts on one topic","fail_check":"PASS — nirvana-founding has 8 rows across 3 source files; the demo tape, the Sellouts, and the Burckhard recruitment are each corroborated in 2+ files.","done":false},{"id":"p2","title":"informational","mode":"loud","read":{"kind":"factual","words":421,"lexile_target":[950,1050],"instruction":"Read this article. Then answer questions 10 through 17.","cited":true,"blocks":[{"n":1,"text":"Nirvana's second album was not supposed to be an event. Before it came out, the band was expected to do about as well as Sonic Youth's Goo — respectable, not enormous. The record company had a plan for the single, and the plan was Come as You Are. Smells Like Teen Spirit went to radio on August 27, 1991, and was released as the lead single on September 10.","cites":["04-123","04-084","04-083"]},{"n":2,"text":"It did not chart at first. It sold mainly in the places where Nirvana already had an audience. Danny Goldberg, who managed the band, later said that nobody on their team heard it as a crossover song, and then the public rushed out like lemmings to buy it.","cites":["04-083","04-085"]},{"n":3,"text":"College and modern-rock stations played it anyway. The video premiered on MTV's 120 Minutes on September 29, 1991, and moved into the channel's Buzz Bin rotation from October through the middle of December. Many American Top 40 stations were still reluctant, and kept the song penned into night-time play.","cites":["04-084","04-086","04-088"]},{"n":4,"text":"The numbers arrived anyway. The single peaked at number 6 on the Billboard Hot 100 in the same week the album reached number 1. Nevermind was certified gold on November 27, 1991, was selling 400,000 copies a week by Christmas, and in January 1992 replaced Michael Jackson's Dangerous at the top of the chart.","cites":["04-087","04-124"]},{"n":5,"text":"Critics treated the change as a replacement rather than an addition. Michael Azerrad called it a sea-change in which glam metal fell out of favor and music that sounded authentic took its place. Billboard's William Goodman put it harder: the album killed off hair metal and sparked a cultural revolution.","cites":["04-125","04-023"]},{"n":6,"text":"The record business moved fast. Jon Pareles described labels in 1992 scrambling after bands they could call ornery, obstreperous, and unkempt. Soundgarden, Alice in Chains, and Temple of the Dog all landed in the top hundred sellers of 1992, and Cameron Crowe's film Singles put the Seattle scene on screen as scenery.","cites":["04-030","04-127","04-128"]},{"n":7,"text":"Seattle noticed what was being done to it. Coverage described the city as one community with one sound, when the actual scene held many. The New York Times compared the grunging of America to earlier mass-marketings of punk and disco, and was tricked into printing a list of fake grunge slang. Jonathan Poneman said that in Seattle all things grunge were treated with cynicism and amusement.","cites":["04-129","04-131","04-132"]},{"n":8,"text":"The cost landed on one person. Rolling Stone's later citation said no recent album had such an overpowering impact on a generation and such a catastrophic effect on its creator. Kurt Cobain told Azerrad, Famous is the last thing I wanted to be.","cites":["04-021","04-134"]}]},"doc":{"id":"D2","kind":"timeline","border":"inline","setup":"A timeline of the sixteen weeks in which Nevermind went from an ordinary release to the number one album in the country.","source":"Source: Built from fact rows 04-083, 04-086, 04-087, 04-124. Rights unverified.","caption":"Sixteen weeks, August 1991 to January 1992.","entries":[{"date":"August 27, 1991","event":"Smells Like Teen Spirit is sent to radio.","cite":"04-083"},{"date":"September 10, 1991","event":"The song is released as the lead single. It does not chart.","cite":"04-083"},{"date":"September 29, 1991","event":"The video premieres on MTV's 120 Minutes.","cite":"04-086"},{"date":"October to mid-December 1991","event":"The video runs in MTV's Buzz Bin rotation.","cite":"04-086"},{"date":"November 27, 1991","event":"Nevermind is certified gold.","cite":"04-124"},{"date":"Christmas 1991","event":"The album is selling 400,000 copies a week.","cite":"04-124"},{"date":"January 1992","event":"Nevermind replaces Michael Jackson's Dangerous at number 1; the single peaks at number 6.","cite":"04-124, 04-087"}],"words":0},"media":[{"slot":"p2-img1","role":"hero","want":"06-P02 — Cobain and Novoselic, 1992 MTV VMAs, credited to Flickr user P.B. Rage","url":"https://commons.wikimedia.org/wiki/File:Nirvana_around_1992_(high_quality).jpg","caption":"","source_line":"","status":"awaiting manifest"},{"slot":"p2-img2","role":"dense","want":"06-P04 — Bleach album, Sub Pop, 1989","url":"https://commons.wikimedia.org/wiki/File:Bleach_by_Nirvana_(Album-CD)_(US-1989).png","caption":"","source_line":"","status":"awaiting manifest"},{"slot":"p2-img3","role":"dense","want":"06-P03 — Kurt Cobain portrait, higher-resolution of the duplicate pair","url":"https://commons.wikimedia.org/wiki/File:Kurt_Cobain.jpg","caption":"","source_line":"","status":"awaiting manifest"},{"slot":"p2-img4","role":"dense","want":"MoPOP 1992 VMA trophy — gloss on 06-P16 reports the engraving appears to misspell the song title","url":"https://commons.wikimedia.org/wiki/Category:Nirvana_-_collections_of_the_Museum_of_Pop_Culture","caption":"","source_line":"","status":"awaiting manifest"},{"slot":"p2-img5","role":"dense","want":"any dated, credited band photograph from Category:Nirvana (musical group)","url":"https://commons.wikimedia.org/wiki/Category:Nirvana_(musical_group)","caption":"","source_line":"","status":"awaiting manifest"}],"distractors":["restates","true-but-irrelevant","contradicts"],"tiles":[{"id":"p2-tile1","claim":"Nevermind brought Seattle grunge and alternative rock into the commercial and cultural mainstream.","cite":"03-328, 04-018, 01-505","rarity":"common","skin":"artist","collected":false},{"id":"p2-tile2","claim":"The label expected Come as You Are, not Smells Like Teen Spirit, to be the song that crossed over.","cite":"04-084","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile3","claim":"Smells Like Teen Spirit went to radio on August 27, 1991, and was released as a single on September 10, 1991.","cite":"04-083","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile4","claim":"The video premiered on MTV's 120 Minutes on September 29, 1991, and ran in the Buzz Bin from October to mid-December.","cite":"04-086","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile5","claim":"Many American Top 40 stations restricted Smells Like Teen Spirit to night-time play.","cite":"04-088","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile6","claim":"Nevermind was certified gold on November 27, 1991, and was selling 400,000 copies a week by Christmas.","cite":"04-124","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile7","claim":"In January 1992 Nevermind replaced Michael Jackson's Dangerous at number 1 on the Billboard albums chart.","cite":"04-124","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile8","claim":"Gary Gersh, who signed Nirvana to Geffen, said there is a pre-Nirvana and a post-Nirvana record business.","cite":"04-022","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile9","claim":"The New York Times was tricked into printing a list of fake grunge slang.","cite":"04-131","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile10","claim":"Kurt Cobain told Michael Azerrad, Famous is the last thing I wanted to be.","cite":"04-134","rarity":"rare","skin":"artist","collected":false},{"id":"p2-tile11","claim":"Fugazi's Guy Picciotto said Nevermind's success made his own band's records feel like a hobo pissing in the forest.","cite":"03-328, 04-028","rarity":"uncommon","skin":"artist","collected":false},{"id":"p2-tile12","claim":"Michael Azerrad wrote that Nevermind marked a generational shift comparable to 1950s rock and roll.","cite":"03-330, 04-026","rarity":"uncommon","skin":"artist","collected":false}],"nodes":[{"id":"p2-mc1","kind":"MC","costume":"article","game":"chip","stem":"Which statement best expresses a central idea of the article?","options":["A. An album that nobody expected to succeed changed both the music business and the life of the person who made it.","B. Radio stations in the United States were slow to play new kinds of music in 1991.","C. Seattle produced more successful bands in the early 1990s than any other American city.","D. Michael Jackson's Dangerous was the best-selling album of the early 1990s."],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"standard":"NGLS.ELA.Content.NY-6R2","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraphs 1 and 8","distractor_trace":{"B":"paragraph 3, the Top 40 reluctance — true, not central","C":"paragraph 6, the 1992 top sellers — true-but-irrelevant","D":"paragraph 4, Dangerous — contradicts the paragraph"},"cites":["04-123","04-021"],"links":[],"answered":false},{"id":"p2-mc2","kind":"MC","costume":"article","game":"chip","stem":"Read this claim. Nirvana's own team did not expect the song to succeed. Which detail from the article best supports this claim?","option_form":"quote (paragraph N)","options":["A. Nobody on their team heard it as a crossover song. (paragraph 2)","B. The video premiered on MTV's 120 Minutes on September 29, 1991. (paragraph 3)","C. Nevermind was certified gold on November 27, 1991. (paragraph 4)","D. The New York Times compared the grunging of America to earlier mass-marketings of punk and disco. (paragraph 7)"],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"standard":"NGLS.ELA.Content.NY-6R8","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraph 2","distractor_trace":{"B":"true, supports the MTV point instead","C":"true, supports the sales point instead","D":"true, supports the backlash point instead"},"cites":["04-085"],"links":[],"answered":false},{"id":"p2-mc3","kind":"MC","costume":"article","game":"chip","stem":"In paragraph 3, the author writes that Top 40 stations kept the song penned into night-time play. What is the effect of the word penned?","options":["A. It suggests the stations were writing about the song rather than playing it.","B. It suggests the song was being held back by force rather than simply scheduled.","C. It suggests the song was too long for daytime radio.","D. It suggests the stations had made a written agreement with the record label."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R4","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraph 3","distractor_trace":{"A":"the other meaning of the word — plausible, wrong here","C":"true of many singles, not stated","D":"paragraph 1, the label's plan — real detail, wrong relation"},"cites":["04-088"],"links":[],"answered":false},{"id":"p2-mc4","kind":"MC","costume":"article","game":"chip","stem":"What job does paragraph 4 do in the article?","options":["A. It introduces the people who managed the band.","B. It explains why radio stations were reluctant to play the song.","C. It supplies the measurements that show how completely the early expectations were wrong.","D. It describes how other Seattle bands responded to Nirvana's success."],"key":"C","points":1,"lanes":{"type":"MC","key":"C","points":1,"standard":"NGLS.ELA.Content.NY-6R5","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraph 4","distractor_trace":{"A":"paragraph 2, Danny Goldberg — real, wrong paragraph","B":"paragraph 3 — real, wrong paragraph","D":"paragraph 6 — real, wrong paragraph"},"cites":["04-087","04-124"],"links":[],"answered":false},{"id":"p2-mc5","kind":"MC","costume":"article","game":"chip","stem":"What is the author's main purpose in the article?","options":["A. To persuade readers that Nevermind is the best album of the 1990s.","B. To explain how a record nobody predicted became a commercial and cultural turning point, and what it cost.","C. To describe the process by which records are certified gold and platinum.","D. To compare Nirvana's sales with the sales of Pearl Jam and Soundgarden."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraphs 1 and 8","distractor_trace":{"A":"paragraph 5, the critics' praise — real, overstated into opinion","C":"paragraph 4, certified gold — real detail, wrong relation","D":"paragraph 6, the 1992 sellers — real detail, wrong relation"},"cites":["04-123","04-021"],"links":[],"answered":false},{"id":"p2-mc6","kind":"MC","costume":"article","game":"chip","stem":"Based on paragraphs 5 through 7, what is the relationship between Nevermind's success and the record business?","options":["A. The record business created Nevermind's success by planning the single carefully.","B. Nevermind's success changed what the record business went looking for afterward.","C. The record business ignored Nevermind's success until 1993.","D. Nevermind's success had no effect outside of Seattle."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R3","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraph 6","distractor_trace":{"A":"paragraph 1, the label's plan — real detail, reversed","C":"paragraph 6, the 1992 scramble — contradicts","D":"paragraph 7, the grunging of America — contradicts"},"cites":["04-030","04-127"],"links":["p2-tile8"],"answered":false},{"id":"p2-mc7","kind":"MC","costume":"article","game":"chip","stem":"How is Kurt Cobain first introduced in the article?","options":["A. As the writer of the song that went to radio in August 1991.","B. As the person the album's success was most costly to.","C. As a member of a Creedence Clearwater Revival tribute band.","D. As the musician who signed Nirvana to Geffen."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R5","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"paragraph 8","distractor_trace":{"A":"true of him, never said in this article","C":"true, and it is on Page 1, not here","D":"paragraph 5 and tile 8 — that was Gary Gersh, contradicts"},"cites":["04-134"],"links":["p1-tile5"],"answered":false},{"id":"p2-cr1","kind":"CR2","costume":"timeline","game":"none","stem":"This question is worth 2 credits. How does the timeline help develop a central idea of the article? Include your claim and use two details from the timeline to support your response.","points":2,"lanes":{"type":"CR2","key":"rubric","points":2,"standard":"NGLS.ELA.Content.NY-6R7","strand":"Reading Standards for Informational Text","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["It shows how short the distance was between failure and number one, since the single did not chart on September 10 and the album was number one by January.","It puts the MTV dates next to the sales dates, which shows that television exposure came before the sales did.","It shows the speed of the change, with gold certification on November 27 and 400,000 copies a week only weeks later.","The dates prove the article's claim that nobody expected the record to sell, because two months pass before anything happens.","It separates the release from the success, so the reader can see that the record did not arrive successful.","The Buzz Bin entry from October to mid-December lines up with the jump in sales, connecting the two.","It ends on the album replacing Dangerous, which measures the change against the biggest artist of the previous era.","The timeline gives dates for claims the article only describes in words, which makes the article's argument checkable."],"rejected":["The timeline shows what happened to the song. (restates the timeline's purpose)","The song came out on September 10, 1991. (copies one entry, no claim)","The album went to number one in January 1992. (copies one entry, no claim)","The timeline is helpful because it has dates. (no textual support)","It tells about MTV. (restates entry three)"],"fragment":"the distance between a single that did not chart and a number one album was sixteen weeks","cites":["04-083","04-086","04-124","04-087"],"links":["p3-cr1"],"answered":false}],"stacks":[{"id":"p2-stack1","size":5,"tiles":["p2-tile2","p2-tile5","p2-tile8","p2-tile9","p2-tile11"]}],"synth":[],"fail":false,"fail_rule":"topic not in 2+ sources","fail_check":"PASS — grunge-mainstream-breakthrough and nevermind-cultural-impact each draw on 2 source files; the mainstreaming claim itself appears in 3.","done":false},{"id":"p3","title":"lyrics","mode":"loud","read":{"kind":"lyric","words":234,"title":"Smells Like Teen Spirit","citation":"Nirvana, Smells Like Teen Spirit, Nevermind, DGC Records, 1991. Lyric text supplied by Brandon, 2026-09-01. Not present in mock.db.","rights":"unverified","instruction":"Read this song lyric. Then answer questions 18 through 24."},"doc":{"id":"D3","kind":"lyric","border":"inline","setup":"The song was written in Aberdeen and released in 1991. Its author gave two different explanations of what it was about, a year apart.","source":"Source: Nirvana, Smells Like Teen Spirit, Nevermind, DGC Records, 1991.","caption":"Lines are numbered for reference.","lines":["1  Load up on guns, bring your friends","2  It's fun to lose and to pretend","3  She's over-bored, and self-assured","4  Oh no, I know a dirty word","5  Hello, hello, hello, how low?","6  Hello, hello, hello, how low?","7  Hello, hello, hello, how low?","8  Hello, hello, hello","9  With the lights out, it's less dangerous","10 Here we are now, entertain us","11 I feel stupid and contagious","12 Here we are now, entertain us","13 A mulatto, an albino","14 A mosquito, my libido, yeah","15 Hey, yey","16 I'm worse at what I do best","17 And for this gift, I feel blessed","18 Our little group has always been","19 And always will until the end","20 Hello, hello, hello, how low?","21 Hello, hello, hello, how low?","22 Hello, hello, hello, how low?","23 Hello, hello, hello","24 With the lights out, it's less dangerous","25 Here we are now, entertain us","26 I feel stupid and contagious","27 Here we are now, entertain us","28 A mulatto, an albino","29 A mosquito, my libido, yeah","30 Hey, yey","31 And I forget just why I taste","32 Oh yeah, I guess it makes me smile","33 I found it hard, it's hard to find","34 Oh well, whatever, never mind","35 Hello, hello, hello, how low?","36 Hello, hello, hello, how low?","37 Hello, hello, hello, how low?","38 Hello, hello, hello","39 With the lights out, it's less dangerous","40 Here we are now, entertain us","41 I feel stupid and contagious","42 Here we are now, entertain us","43 A mulatto, an albino","44 A mosquito, my libido","45 A denial, a denial","46 A denial, a denial","47 A denial, a denial","48 A denial, a denial","49 A denial"]},"media":[],"tiles":[{"id":"p3-tile1","claim":"Cobain said the line Here we are now, entertain us came from something he said to break the ice when walking into a party.","cite":"02-083","rarity":"rare","skin":"artist","collected":false},{"id":"p3-tile2","claim":"Cobain called the main riff cliched, close to a Boston riff or Louie Louie, and made the band play it for an hour and a half.","cite":"02-082","rarity":"rare","skin":"artist","collected":false},{"id":"p3-tile3","claim":"Critic Dave Marsh called the song the Louie Louie of the nineties.","cite":"03-099","rarity":"rare","skin":"artist","collected":false},{"id":"p3-tile4","claim":"Michael Azerrad read the couplet A mulatto, an albino, a mosquito, my libido as a list of outsiders. Cobain separately said the song was about his friends, and later that it was made of contradictory ideas.","cite":"03-100, 03-102, 03-103","rarity":"common","skin":"artist","collected":false},{"id":"p3-tile5","claim":"A Geffen radio promoter noted the lyrics were hard to decipher because of their nonsensicality and Cobain's slurred delivery.","cite":"03-098","rarity":"rare","skin":"artist","collected":false}],"nodes":[{"id":"p3-mc1","kind":"MC","costume":"lyric","game":"chip","stem":"In line 11, the speaker says he feels stupid and contagious. What does the figurative use of contagious suggest?","options":["A. The speaker believes he is physically ill.","B. The speaker thinks his state of mind is spreading to the people around him.","C. The speaker is warning the audience to keep their distance.","D. The speaker has been told he is dangerous by someone else."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R4","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"line 11","distractor_trace":{"A":"the literal sense of the word — plausible, not figurative","C":"line 9, less dangerous — real, wrong relation","D":"line 9 — real, wrong speaker"},"cites":[],"links":[],"answered":false},{"id":"p3-mc2","kind":"MC","costume":"lyric","game":"chip","stem":"In line 3 the speaker calls someone over-bored rather than simply bored. What does the choice of over-bored suggest that bored would not?","options":["A. That the boredom has gone past an ordinary limit and become a condition.","B. That the person is older than the speaker.","C. That the person is bored by the speaker specifically.","D. That the person has too much to do."],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"standard":"NGLS.ELA.Content.NY-6L5","strand":"Language Standards","subscore":"Reading","secondary":""},"binds":"line 3","distractor_trace":{"B":"the prefix over- read as age — plausible, wrong","C":"line 3, she — real, wrong relation","D":"the opposite of bored — contradicts"},"cites":[],"links":[],"answered":false},{"id":"p3-mc3","kind":"MC","costume":"lyric","game":"arcade","stem":"The speaker's word choice in lines 16 and 17 affects the song by—","options":["A. establishing that the speaker is proud of his abilities","B. creating a contradiction that makes the speaker's gratitude sound bitter","C. explaining why the speaker formed a group","D. describing a religious experience the speaker has had"],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R4","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"lines 16-17","distractor_trace":{"A":"line 16, what I do best — real phrase, reversed","C":"line 18, our little group — real, wrong lines","D":"line 17, blessed — real word, wrong relation"},"cites":[],"links":[],"answered":false},{"id":"p3-mc4","kind":"MC","costume":"lyric","game":"chip","stem":"What job do lines 5 through 8 do in the structure of the song?","options":["A. They introduce the person described in the first verse.","B. They resolve the question raised in lines 1 and 2.","C. They act as a hinge between the verse and the chorus, turning a greeting into a question.","D. They list the members of the speaker's group."],"key":"C","points":1,"lanes":{"type":"MC","key":"C","points":1,"standard":"NGLS.ELA.Content.NY-6R5","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"lines 5-8","distractor_trace":{"A":"line 3, she — real, wrong section","B":"lines 1-2 — real, nothing is resolved","D":"line 18, our little group — real, wrong section"},"cites":[],"links":[],"answered":false},{"id":"p3-mc5","kind":"MC","costume":"lyric","game":"arcade","stem":"The word denial is repeated nine times in lines 45 through 49. What does the repetition most suggest?","options":["A. That the speaker is naming something he refuses to look at directly.","B. That the speaker has forgotten the rest of the words.","C. That the speaker is arguing with a specific person.","D. That the song is about a court case."],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"standard":"NGLS.ELA.Content.NY-6R4","strand":"Reading Standards for Literature","subscore":"Reading","secondary":""},"binds":"lines 45-49","distractor_trace":{"B":"line 34, whatever, never mind — real, wrong relation","C":"line 3, she — real, wrong relation","D":"the legal sense of denial — plausible, wrong"},"cites":["03-098"],"links":["p3-tile5"],"answered":false},{"id":"p3-mc6","kind":"MC","costume":"lyric","game":"arcade","stem":"What does the phrase It's fun to lose and to pretend in line 2 suggest about the speaker's attitude?","options":["A. He enjoys competitive games.","B. He treats failure as something to perform rather than something to avoid.","C. He is describing a childhood memory.","D. He believes he will win in the end."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6L4","strand":"Language Standards","subscore":"Reading","secondary":""},"binds":"line 2","distractor_trace":{"A":"the word lose — literal, wrong","C":"line 1, bring your friends — real, wrong relation","D":"line 19, always will until the end — real, contradicts"},"cites":[],"links":[],"answered":false},{"id":"p3-cr1","kind":"CR2","costume":"lyric","game":"none","stem":"This question is worth 2 credits. What does the phrase Here we are now, entertain us in line 10 suggest about the relationship between the speaker and his audience? Include your claim and use two details from the lyrics to support your response.","points":2,"lanes":{"type":"CR2","key":"rubric","points":2,"standard":"NGLS.ELA.Content.NY-6R4","strand":"Reading Standards for Literature","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["It suggests the speaker is demanding attention while making fun of the demand, because the line is repeated immediately in line 12 as though it were a chant.","It suggests the relationship is bored on both sides, since line 3 already calls someone over-bored.","The speaker puts himself in the crowd by saying us rather than me, so he is not separate from the people he is mocking.","The line is a demand with no object, since nothing is ever named that would entertain them.","Pairing it with I feel stupid and contagious in line 11 suggests the speaker thinks the demand is a sickness he shares.","The repetition of the line four times across the song makes it sound less like a request each time.","The lights out in line 9 suggests the audience cannot see him, which makes the demand for entertainment strange.","It suggests the speaker is performing an attitude rather than expressing one, matching line 2 about pretending."],"rejected":["The speaker wants to be entertained. (restates line 10)","He says here we are now, entertain us. (copies the line)","The audience is watching the singer. (no textual support)","The line is repeated a lot in the song. (observation without a claim)","It means the crowd is bored. (restates line 3 without connecting it)"],"fragment":"a demand for attention that mocks the person making it","cites":["02-083","03-098"],"links":["p5-cr1","p1-cr1"],"answered":false}],"graph":{"nodes":["p1-tile1","p1-tile2","p1-tile3","p1-tile4","p1-tile5","p1-tile6","p2-tile1","p2-tile2","p2-tile3","p2-tile4","p2-tile5","p2-tile6","p2-tile7","p2-tile8","p2-tile9","p2-tile10","p2-tile11","p2-tile12"],"relations":["cause","effect","contrast","same event"],"model_edges":[{"from":"p2-tile2","to":"p2-tile4","relation":"contrast","reasoning":"The label chose a different song to push, and the song they did not choose is the one MTV put in rotation, so the plan and the outcome point in opposite directions."},{"from":"p2-tile4","to":"p2-tile6","relation":"cause","reasoning":"The video entered Buzz Bin rotation in October and the album was certified gold on November 27, so the exposure comes first and the sales follow it."}],"student_edges":[]},"links":["p1-cr1","p5-cr1"],"synth":[],"fail":false,"fail_rule":"no lyric row","fail_check":"PASS BY SUPPLY — mock.db contains commentary about the lyrics but no lyric text. Brandon supplied the full lyric on 2026-09-01. D3 is not database-sourced; every question about it is answerable from the supplied text.","done":false},{"id":"p4","title":"document pair","mode":"calm","topic":"The end of Nirvana's touring, 1994","definitions":["Identify—means to put a name to or to name.","Explain—means to make plain or understandable; to give reasons for or causes of; to show the logical development or relationship of something.","Cause—refers to something that contributes to the occurrence of an event, the rise of an idea, or the bringing about of a development.","Effect—refers to what happens as a consequence (result, impact, outcome) of an event, an idea, or a development.","Turning Point—is a major event, idea, or historical development that brings about significant change. It can be local, regional, national, or global.","Geographic Context—refers to where this historical development is taking place and why it is taking place there."],"docs":[{"id":"D4","kind":"visual","border":"b-roll","setup":"This is a photograph of a handwritten setlist attributed to Nirvana. The image is in the public domain, credited to Andreas Wylner by way of the German-language Wikipedia. The record for this image carries no venue and no date. What show it belongs to has not been established.","source":"Source: Wikimedia Commons, File:Nirvana Last Setlist.jpg, via passage row 06-P06. Venue and date unestablished. Rights unverified.","caption":"A setlist in handwriting. Nothing on the page says where or when.","url":"https://commons.wikimedia.org/wiki/File:Nirvana_Last_Setlist.jpg","words":0,"cite":"06-P06","status":"awaiting file from untitled.2"},{"id":"p4-text","kind":"document","border":"inline","setup":"This is from a Los Angeles Times article published in April 1994, while the events it describes were still going on. It reported that Nirvana had withdrawn from talks to headline the Lollapalooza festival that summer.","source":"Source: Los Angeles Times, Nirvana Pulls Out of Tour Plan, April 1994, via passage row 01-P35. Rights unverified.","words":118,"cite":"01-P35","text":"On April 6, 1994, Nirvana withdrew from negotiations to headline that summer's Lollapalooza tour. The report cited the singer's health following his hospitalization in Rome the previous month. Concert promoters quoted in the article described the withdrawal in the language of the industry: a lineup problem, a scheduling problem, a large amount of money now unattached to a headliner. The article was written for readers of a daily newspaper's entertainment section, and it treated the cancellation as business news. Two days after it was published, the singer's body was found in Seattle. Nothing in the article anticipates that. It reports what a tour promoter would have wanted to know that week."}],"media":[],"tiles":[{"id":"p4-tile1","claim":"On April 6, 1994, Nirvana withdrew from talks to headline Lollapalooza, with the singer's health after the Rome hospitalization cited as the reason.","cite":"01-P35, 01-P48","rarity":"uncommon","skin":"artist","collected":false},{"id":"p4-tile2","claim":"The Nirvana Last Setlist image carries no venue and no date; its record flags that a show has not been established for it.","cite":"06-P06","rarity":"rare","skin":"artist","collected":false},{"id":"p4-tile3","claim":"Contemporaneous coverage of the Lollapalooza withdrawal reported industry reaction from concert promoters, not the band.","cite":"01-P35","rarity":"rare","skin":"artist","collected":false}],"nodes":[{"id":"p4-cr1","kind":"CR1","role":"Context","costume":"document","game":"none","stem":"Explain the historical circumstances that led to Nirvana's withdrawal from the Lollapalooza tour in April 1994. [1]","points":1,"lanes":{"type":"CR1","key":"rubric","points":1,"standard":"NGLS.ELA.Content.NY-6R1","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"rejected-list entry","definitions_printed":["Explain"],"accepted":["The singer had been hospitalized in Rome the month before, and his health was given as the reason the band pulled out.","The band was in the middle of a period of illness and cancelled commitments, and the festival was one of them.","Nirvana had been in negotiations to headline Lollapalooza and ended those negotiations on April 6, 1994.","Cobain's condition after Rome made a summer headlining tour something the band would not commit to.","The withdrawal happened while the singer's health situation was unresolved and public.","A large summer festival needed a headliner, and Nirvana's health situation meant they could not be that headliner.","The band was the expected headliner, so their withdrawal was reported as news rather than as a private decision.","The article describes a decision made under pressure from a medical emergency that had happened in another country weeks earlier."],"rejected":["Nirvana pulled out of the tour. (restates the title)","They did not want to play Lollapalooza. (restates without circumstances)","It happened on April 6, 1994. (date without circumstances)","Kurt Cobain was sick. (no circumstance given)","The Los Angeles Times wrote about it. (source, not circumstance)"],"fragment":"a summer tour cancelled by a medical emergency in another country","cites":["01-P35","01-P48"],"links":[],"answered":false},{"id":"p4-cr2","kind":"CR1","role":"Source","costume":"document","game":"none","stem":"Based on this excerpt, explain how the intended audience affects what the Los Angeles Times includes in Nirvana Pulls Out of Tour Plan. [1]","points":1,"lanes":{"type":"CR1","key":"rubric","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"rejected-list entry","definitions_printed":["Explain"],"accepted":["It was written for the entertainment section of a daily paper, so it reports the cancellation as business news rather than as a personal crisis.","The audience is people who follow the music industry, so the article quotes concert promoters instead of the band.","Because readers wanted to know about the tour, the article measures the event in money and scheduling.","The intended audience explains why the singer's health appears as a cited reason rather than as the subject.","Readers of an entertainment section expect lineup news, so the article frames a medical emergency as a lineup problem.","The audience did not need the singer's private situation explained, so the article leaves it at a reference to Rome.","It includes industry reaction because that is what its readers could act on, and omits anything the promoters would not have known.","The article's audience was reading in real time, so it contains no hindsight about what happened two days later."],"rejected":["The audience is people who read the Los Angeles Times. (names the audience, no effect)","It was in a newspaper. (restates the source line)","The article is about Nirvana. (restates the subject)","It includes facts about the tour. (restates the content)","The audience liked Nirvana. (no textual support)"],"fragment":"an emergency reported as a scheduling problem because that is what the readers had come for","cites":["01-P35"],"links":[],"answered":false},{"id":"p4-cr3","kind":"CR1","role":"Relationship","costume":"visual","game":"none","stem":"Identify and explain a cause-and-effect relationship between the situation described in the Los Angeles Times article and what can and cannot be determined from the setlist photograph. [1]","points":1,"lanes":{"type":"CR1","key":"rubric","points":1,"standard":"NGLS.ELA.Content.NY-6R3","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":"5R7"},"binds":"rejected-list entry","definitions_printed":["Identify","Explain","Cause","Effect"],"accepted":["Because the band stopped touring in 1994, a setlist with no date became difficult to place, since there is no later show to compare it to.","The cause is that the tour ended abruptly; the effect is that documents from the final period were never sorted or labeled.","The file is called Last Setlist, but nothing on the page establishes that, so the name is an effect of what people believe rather than of what the document shows.","The cause is an unplanned ending; one effect is that ordinary paperwork from that period carries more weight than it was meant to.","Because the article was written in real time, it does not identify a final show either, so neither document can date the end.","The effect of missing venue and date information is that the photograph can support a claim about what a show looked like, but not about when it happened.","The cause is the cancellation of the summer tour; the effect is that the shows already played became the complete record.","A researcher can use the article to date a decision but cannot use the setlist to date a performance, so the two documents do different jobs."],"rejected":["The setlist does not have a date. (restates the setup)","Nirvana cancelled their tour. (restates the article)","The photograph shows a setlist. (restates the caption)","The two documents are both about Nirvana. (no relationship named)","The setlist was from the last show. (contradicts the document record)"],"fragment":"an ending that arrived before anyone labeled the paperwork","cites":["06-P06","01-P35"],"links":["p4-tile2"],"answered":false},{"id":"p4-mc1","kind":"MC","costume":"document","game":"review","stem":"A historian would find the Los Angeles Times article most useful for—","options":["A. determining the exact cause of the singer's death","B. establishing what the music industry knew and expected in the first week of April 1994","C. identifying which songs Nirvana played at their final concert","D. explaining why Nevermind sold as well as it did"],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"the article, sentences 4 through 6","review_reveal":true,"cites":["01-P35"],"links":[],"answered":false},{"id":"p4-mc2","kind":"MC","costume":"visual","game":"review","stem":"Which claim is best supported by the setlist photograph on its own?","options":["A. The setlist was written at Nirvana's final performance.","B. The band planned an order of songs in advance and wrote it down by hand.","C. The setlist was written in 1994.","D. The band performed every song on the list."],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R1","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":"5R7"},"binds":"the setup line for D4","review_reveal":true,"cites":["06-P06"],"links":["p4-tile2"],"answered":false},{"id":"p4-mc3","kind":"MC","costume":"document","game":"review","stem":"Which statement best describes the point of view of the Los Angeles Times article?","options":["A. It mourns the loss of a band that will not tour again.","B. It criticizes the band for withdrawing from the festival.","C. It reports a business decision to readers who follow the industry, without knowing what will follow.","D. It defends the concert promoters against the band's management."],"key":"C","points":1,"lanes":{"type":"MC","key":"C","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"the article, sentences 3 through 5","review_reveal":true,"cites":["01-P35"],"links":[],"answered":false}],"synth":[{"id":"p4-syn1","ask":"The setlist is called Last because of what happened afterward, not because of anything written on it. What does that show about how documents get their meaning?","pair":"p3-tile4","rarity":"rarest","hidden_as":"caption on a picture","found":false}],"fail":false,"fail_rule":"no url row for the artist","fail_check":"PASS — 06-P06 supplies a visual document with a url; 01-P35 supplies the paired text under 250 words.","done":false},{"id":"p5","title":"two accounts","mode":"calm","topic":"Smells Like Teen Spirit, told by the person who wrote it and by the people who wrote about it","docs":[{"id":"D5","kind":"account","voice":"artist","border":"b-roll","setup":"This account is assembled from things Kurt Cobain said about Smells Like Teen Spirit in interviews between 1991 and 1994. Every sentence in it is his.","source":"Source: Kurt Cobain, quoted in fact rows 02-081, 02-082, 02-083, 02-084, 02-112, 04-094. Rights unverified.","words":268,"cite":"02-081, 02-082, 02-083, 02-084, 02-112, 04-094","text":"On the riff: Teen Spirit was such a cliched riff. It was so close to a Boston riff or Louie Louie. When I came up with the guitar part, Krist looked at me and said, That is so ridiculous. I made the band play it for an hour and a half. On the line everyone quotes: That came from something I used to say every time I used to walk into a party to break the ice. A lot of times, when you're standing around with people in a room, it's really boring and uncomfortable. So it was, Well, here we are, entertain us. You invited us here. On what the attention did to it: Everyone has focused on that song so much. The reason it gets a big reaction is people have seen it on MTV a million times. It's been pounded into their brains. But I think there are so many other songs that I've written that are as good, if not better, than that song, like Drain You. On playing it in 1994: it was almost an embarrassment. On what was lost: Actually, we did have our own thing for a while. For a few years in Seattle, it was the Summer of Love, and it was so great. To be able to just jump out on top of the crowd with my guitar and be held up and pushed to the back of the room, and then brought back with no harm done to me — it was a celebration. But once it got into the mainstream, it was over. I'm just tired of being embarrassed by it. I'm beyond that."},{"id":"p5-other","kind":"account","voice":"press and critics","border":"inline","setup":"This account is assembled from what critics, journalists, and the band's own management said about the same song over the same years.","source":"Source: Fact rows 03-098, 03-099, 03-100, 04-085, 04-091, 04-092, 04-093, 04-123. Rights unverified.","words":291,"cite":"03-098, 03-099, 03-100, 04-085, 04-091, 04-092, 04-093, 04-123","text":"Nobody in the business heard it coming. Danny Goldberg, who managed the band, said none of Nirvana's team heard Teen Spirit as a crossover song, and then the public rushed out like lemmings to buy it. Before the record came out, the expectation had been a minor success on the order of Sonic Youth's Goo; afterward, writers agreed it was Teen Spirit that marked the instigation of the grunge phenomenon. Critics reached for older songs to explain it. Dave Marsh called it the Louie Louie of the nineties. The New York Times compared it to the Sex Pistols' Anarchy in the U.K. and noted the bitter irony that teen spirit is routinely bottled, shrink-wrapped and sold. Michael Azerrad, writing in Rolling Stone in 1992, called it an anthem for — or is it against? — the Why Ask Why? generation, and cautioned against calling it a generational anthem too quickly. The words themselves were treated as a puzzle. A Geffen radio promoter noted the lyrics were hard to decipher because of their nonsensicality and the singer's slurred delivery. Azerrad read the famously obscure couplet about a mulatto, an albino, a mosquito, a libido as a list of people who do not fit anywhere. Charles R. Cross argued the song referenced the singer's relationship with a girlfriend. Within the band, the assessment was practical. Krist Novoselic said in 1993 that without Teen Spirit, Nevermind would not have done as well, and pointed out that there are no Teen Spirits on In Utero. What the accounts share is a subject. What they do not share is who is allowed to say what the song is."}],"media":[],"tiles":[{"id":"p5-tile1","claim":"Danny Goldberg said none of Nirvana's team heard Teen Spirit as a crossover song, and then the public rushed out like lemmings to buy it.","cite":"04-085","rarity":"rare","skin":"artist","collected":false},{"id":"p5-tile2","claim":"The New York Times compared Teen Spirit to Anarchy in the U.K. and noted the irony that teen spirit is routinely bottled, shrink-wrapped and sold.","cite":"04-092","rarity":"rare","skin":"artist","collected":false},{"id":"p5-tile3","claim":"Azerrad called the song an anthem for, or against, the Why Ask Why? generation, and warned against naming it a generational anthem too fast.","cite":"04-091","rarity":"rare","skin":"artist","collected":false},{"id":"p5-tile4","claim":"Novoselic said in 1993 that without Teen Spirit, Nevermind would not have done as well, and that there are no Teen Spirits on In Utero.","cite":"04-093","rarity":"rare","skin":"artist","collected":false},{"id":"p5-tile5","claim":"Cobain said the Seattle years before the mainstream were a celebration, and that once it got into the mainstream, it was over.","cite":"02-084, 02-112","rarity":"uncommon","skin":"artist","collected":false}],"nodes":[{"id":"p5-mc1","kind":"MC","costume":"account","game":"chip","stem":"Which historical situation is most similar to the one described in the second account, in which writers reached for older songs to explain a new one?","options":["A. A newspaper printing a list of slang it had been given without checking it","B. Critics describing an unfamiliar work by comparing it to works their readers already know","C. A record label choosing which single to promote to radio","D. A band recording an album in a professional studio"],"key":"B","points":1,"lanes":{"type":"MC","key":"B","points":1,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"second account, sentences 4 through 6","cites":["03-099","04-092"],"links":["p2-tile9"],"answered":false},{"id":"p5-mc2","kind":"MC","costume":"account","game":"chip","stem":"Which claim is best supported by both accounts?","options":["A. The song's success was not predicted by the people closest to it.","B. The song's lyrics were written about a specific girlfriend.","C. The song was the best song on Nevermind.","D. MTV refused to play the video."],"key":"A","points":1,"lanes":{"type":"MC","key":"A","points":1,"standard":"NGLS.ELA.Content.NY-6R9","strand":"Reading Standards for Informational Text","subscore":"Reading","secondary":""},"binds":"first account sentence 1; second account sentence 2","cites":["02-082","04-085"],"links":[],"answered":false},{"id":"p5-cr1","kind":"CR2","costume":"account","game":"none","stem":"This question is worth 2 credits. What does each account emphasize about Smells Like Teen Spirit? Include your claim and use two details from the accounts to support your response.","points":2,"lanes":{"type":"CR2","key":"rubric","points":2,"standard":"NGLS.ELA.Content.NY-6R6","strand":"Reading Standards for Informational Text","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["Cobain emphasizes how the song was made, describing the riff as cliched and the line as something he used to say at parties, while the critics emphasize what the song came to mean.","The first account emphasizes loss, ending on once it got into the mainstream, it was over, while the second emphasizes arrival, calling the song the instigation of the phenomenon.","Cobain emphasizes that other songs he wrote are as good or better, while the second account emphasizes this song's effect on everything around it.","The artist's account emphasizes ordinary origins, an hour and a half of rehearsal and a line for breaking the ice; the press account emphasizes historical comparison to Louie Louie and Anarchy in the U.K.","Cobain emphasizes repetition and exhaustion, saying it has been pounded into their brains, while the critics emphasize meaning and interpretation.","The second account emphasizes that no one predicted the song, which is also what Goldberg says, while Cobain emphasizes what predicting it would not have changed.","Cobain emphasizes a scene that existed before the song, while the second account begins with the song and works outward.","The first account emphasizes embarrassment; the second emphasizes significance."],"rejected":["Cobain talks about the song and the critics talk about the song. (restates the setup)","The first account is by Kurt Cobain. (identifies the source, no emphasis)","Both accounts are about Smells Like Teen Spirit. (restates the topic)","Dave Marsh called it the Louie Louie of the nineties. (copies a detail, no claim)","The accounts are different. (no textual support)"],"fragment":"the person who made it and the people who explained it were not describing the same object","cites":["02-081","02-112","04-123","03-099"],"links":["p3-cr1"],"answered":false},{"id":"p5-cr2","kind":"CR2","costume":"account","game":"none","stem":"This question is worth 2 credits. What does one account include that the other leaves out? Include your claim and use two details from the accounts to support your response.","points":2,"lanes":{"type":"CR2","key":"rubric","points":2,"standard":"NGLS.ELA.Content.NY-6R9","strand":"Reading Standards for Informational Text","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["Cobain includes the making of the song, the hour and a half of rehearsal and Krist calling the riff ridiculous, which the press account has no access to.","The press account includes the sales expectation before release, Sonic Youth's Goo, which Cobain never mentions.","Cobain includes the Seattle years before the record, the crowd holding him up, which the second account leaves out entirely.","The second account includes competing interpretations of the couplet, from Azerrad and from Cross, which Cobain does not offer.","Cobain includes his own preference for another song, Drain You, which no critic in the second account mentions.","The second account includes Novoselic's practical judgment about the album's sales, which the first account does not.","Cobain includes the emotional cost of the attention; the press account includes the scale of the attention but not its cost.","The second account includes the observation that the lyrics were hard to decipher, which Cobain never addresses as a problem."],"rejected":["The first account leaves out the critics. (restates the structure)","The second account has more sources. (counts sources, no claim)","Cobain talks about himself. (no textual support)","One account is longer than the other. (observation without a claim)","The accounts include different details. (restates the question)"],"fragment":"one account holds the rehearsal room, the other holds the reception","cites":["02-082","02-084","04-123","03-100"],"links":[],"answered":false},{"id":"p5-cr3","kind":"CR4","costume":"account","game":"none","stem":"This question is worth 4 credits. In the two accounts, the relationship between the song and its audience is described in different ways. Write a response that compares how each account presents that relationship.","be_sure_to":["describe how the two accounts are similar and how they are different","explain how the relationship between the song and its audience advances each account","use details from both accounts to support your response"],"points":4,"lanes":{"type":"CR4","key":"rubric","points":4,"standard":"NGLS.ELA.Content.NY-6R3","strand":"Reading Standards for Informational Text","subscore":"Writing to Sources","secondary":""},"binds":"rejected-list entry","accepted":["Both accounts agree the audience was enormous and unexpected; they disagree about whether that was an achievement or a loss.","In Cobain's account the audience takes the song away from him, seen in it's been pounded into their brains; in the press account the audience is proof of the song's importance.","Cobain describes an audience he was once physically part of, held up over the crowd, and then an audience he performs to; the press account never describes an audience he belonged to.","The press account uses the audience to argue for significance, comparing the song to Anarchy in the U.K.; Cobain uses the audience to explain exhaustion.","Both accounts treat the audience as something that arrived rather than something that was built, which is why nobody predicted it.","The relationship advances the press account toward a verdict about a generation and advances Cobain's account toward the sentence once it got into the mainstream, it was over.","Azerrad's hesitation about calling it a generational anthem is the one place the press account moves toward Cobain's view.","In both accounts the audience changes the song without changing a note of it.","Cobain's account ends with the audience still there and the celebration gone; the press account ends with the audience as evidence.","Novoselic's remark that there are no Teen Spirits on In Utero shows a band aware of the audience the second account describes."],"rejected":["Both accounts are about the same song. (restates the topic)","Cobain did not like being famous. (no details from either account)","The critics wrote about the audience. (restates the setup)","The audience bought a lot of records. (detail with no comparison)","The accounts are similar and different. (restates the task)"],"fragment":"an audience that arrived all at once and could not be given back","cites":["02-081","02-084","02-112","04-091","04-092","04-093"],"links":["p6-mx8"],"answered":false}],"synth":[],"fail":false,"fail_rule":"one voice, or voice = source on both","fail_check":"PASS — D5 is Cobain's voice from slice 02 (own words); the paired account draws on eight distinct press and management voices from slices 03 and 04.","done":false},{"id":"p6","title":"arcade","mode":"loud","read":null,"game":{"shell":"brick breaker","bricks":"tiles","rote_pool":["p1-tile1","p1-tile2","p1-tile3","p1-tile4","p1-tile5","p1-tile6","p2-tile1","p2-tile2","p2-tile3","p2-tile4","p2-tile5","p2-tile6","p2-tile7","p2-tile8","p2-tile9","p2-tile10","p2-tile11","p2-tile12","p3-tile1","p3-tile2","p3-tile3","p3-tile4","p3-tile5","p4-tile1","p4-tile2","p4-tile3","p5-tile1","p5-tile2","p5-tile3","p5-tile4","p5-tile5"],"rote_pool_size":31,"rote_reveal":true,"highscore_pool":["same 31 tiles"],"highscore_reveal":false,"powerup":{"streak":3},"rare_unlock":{"streak":5},"difficulty":{"tiers":{"easy":{"lives":5,"show_s":4},"normal":{"lives":3,"show_s":2.5},"hard":{"lives":1,"show_s":1.5}},"chosen":null,"locked":false},"highscore":0,"timers":true,"endless":true},"miniexam":{"blind":true,"reveal":"Go back to Page N","complete":false,"nodes":[{"id":"p6-mx1","kind":"MC","stem":"What was a cause of Krist Novoselic agreeing to form a band with Kurt Cobain?","options":["A. A demo tape of Cobain's earlier project, Fecal Matter","B. An offer from a record label","C. The success of the Melvins","D. The closing of the Aberdeen mills"],"key":"A","source_tile":"p1-tile4","reveal_target":"Go back to Page 1","lanes":{"standard":"NGLS.ELA.Content.NY-6R1","subscore":"Reading"},"answered":false},{"id":"p6-mx2","kind":"MC","stem":"Which statement best describes the record label's expectation for Nevermind's lead single?","options":["A. They expected Smells Like Teen Spirit to cross over.","B. They expected Come as You Are to cross over.","C. They expected no single to be released.","D. They expected the album to fail entirely."],"key":"B","source_tile":"p2-tile2","reveal_target":"Go back to Page 2","lanes":{"standard":"NGLS.ELA.Content.NY-6R1","subscore":"Reading"},"answered":false},{"id":"p6-mx3","kind":"MC","stem":"Which action was a result of the video entering MTV's Buzz Bin rotation?","options":["A. The single was withdrawn from radio.","B. The band cancelled its tour.","C. Album sales rose sharply, reaching gold certification and then 400,000 copies a week.","D. Top 40 stations added the song to daytime rotation immediately."],"key":"C","source_tile":"p2-tile4","reveal_target":"Go back to Page 2","lanes":{"standard":"NGLS.ELA.Content.NY-6R1","subscore":"Reading"},"answered":false},{"id":"p6-mx4","kind":"MC","stem":"According to Cobain, where did the line Here we are now, entertain us come from?","options":["A. A line from an earlier Nirvana song","B. Something he said to break the ice at parties","C. A phrase written by Michael Azerrad","D. Graffiti on a wall in Aberdeen"],"key":"B","source_tile":"p3-tile1","reveal_target":"Go back to Page 3","lanes":{"standard":"NGLS.ELA.Content.NY-6L4","subscore":"Reading"},"answered":false},{"id":"p6-mx5","kind":"MC","stem":"What problem is being described when a document's record lists no venue and no date?","options":["A. The document is a forgery.","B. The document cannot be used to establish when or where an event happened.","C. The document is not in the public domain.","D. The document has been damaged."],"key":"B","source_tile":"p4-tile2","reveal_target":"Go back to Page 4","lanes":{"standard":"NGLS.ELA.Content.NY-6L5","subscore":"Reading"},"answered":false},{"id":"p6-mx6","kind":"MC","stem":"Which claim is best supported by Danny Goldberg's account of the single's release?","options":["A. The band's own team did not predict the song's success.","B. The band demanded the song be released as a single.","C. Radio stations were paid to play the song.","D. The song was successful in every country immediately."],"key":"A","source_tile":"p5-tile1","reveal_target":"Go back to Page 5","lanes":{"standard":"NGLS.ELA.Content.NY-6R1","subscore":"Reading"},"answered":false},{"id":"p6-mx7","kind":"MC","stem":"The release of Nevermind can be considered a turning point because—","options":["A. it was the first album recorded in Seattle","B. it changed what the record industry looked for and what audiences expected afterward","C. it was the band's first release on Sub Pop","D. it was the only album Nirvana recorded"],"key":"B","source_tile":"p2-tile1","reveal_target":"Go back to Page 2","lanes":{"standard":"NGLS.ELA.Content.NY-6R1","subscore":"Reading"},"answered":false},{"id":"p6-mx8","kind":"CR2","stem":"This question is worth 2 credits. Cobain said that once the music got into the mainstream, it was over. The record industry, meanwhile, treated Nevermind as the beginning of something. Explain how both can be true. Include your claim and use two details to support your response.","points":2,"pairs":["p5-tile5","p2-tile1"],"reveal_target":"Go back to Pages 2 and 5","lanes":{"type":"CR2","standard":"NGLS.ELA.Content.NY-6R1","strand":"Reading Standards for Informational Text","subscore":"Writing to Sources"},"accepted":["The same event ended one thing and started another, since the scene Cobain describes depended on being small and the industry's interest depended on it being large.","The industry measured a beginning in sales, while Cobain measured an ending in what the crowd had been to him.","Nevermind brought alternative rock into the mainstream, which is the industry's beginning, and that arrival is exactly what removed the conditions Cobain valued.","Both are true because they are answers to different questions: what happened to the music, and what happened to the people making it.","Cobain describes a celebration that worked because no one was watching; the industry describes a change that mattered because everyone was.","The turning point is real in both accounts; only the direction of the turn differs.","The record business divided itself into pre-Nirvana and post-Nirvana, and Cobain divided his own life the same way, with opposite signs.","Growth for the genre and loss for the scene are the same event described from two positions."],"rejected":["Cobain was sad and the industry was happy. (no details)","The album was very popular. (restates a tile)","Both statements are opinions. (evades the question)","It was a turning point. (restates the term)","Cobain said it was over. (copies the quote)"],"fragment":"the same event, counted as a beginning by one side and an ending by the other","answered":false}]},"fail":false,"fail_check":"PASS — 31 tiles written across Pages 1 through 5, inside the 20-40 rote pool range.","done":false}],"leaderboard":{"avatar":{"preset":null,"name":"","presets":8,"era":"1987-1994, Pacific Northwest"},"tokens":[],"token_object":"45rpm record on a spindle, one per fragment","score":0,"tiles_collected":[],"tiles_total":31,"chips":[],"chips_total":16,"synth_total":2,"difficulty":{"chosen":null,"locked":false},"trophies":{"bronze":0.25,"silver":0.5,"gold":0.8,"platinum":1.0,"platinum_r
