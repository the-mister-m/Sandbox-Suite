/* ------------------------------------------------------------
   BRICK BREAKER — bricks are tiles. Breaking one asks the
   question; right clears it, wrong puts it back.
   ------------------------------------------------------------ */
function makeBreaker(cv, screen){
  const ctx = cv.getContext('2d');
  const W=cv.width, H=cv.height;
  let raf=null, running=false, mode='review';
  let paddle, ball, bricks, lives, score, streak, paused, powerUntil;

  const COLS=8, BW=88, BH=26, PADX=16, PADY=44, GAP=6;

  function layout(){
    bricks=[];
    const pool = ROTE.slice();
    for(let i=pool.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]];
    }
    pool.slice(0,32).forEach((q,i)=>{
      const c=i%COLS, r=Math.floor(i/COLS);
      bricks.push({x:PADX+c*(BW+GAP), y:PADY+r*(BH+GAP),
        w:BW, h:BH, q, alive:true});
    });
  }
  function reset(){
    const tier = page('p6').game.difficulty.tiers[S.difficulty||'normal'];
    lives = tier.lives; score=0; streak=0; paused=false; powerUntil=0;
    paddle = {x:W/2-58, w:116, h:12, y:H-26};
    launch();
    layout();
    hud();
  }
  function launch(){
    ball = {x:W/2, y:H-46, r:7, vx:(Math.random()<.5?-1:1)*3.1, vy:-3.7};
  }
  function hud(){
    const set=(id,v)=>{ const n=document.getElementById(id); if(n) n.textContent=v; };
    set('hud-score',score); set('hud-lives',lives);
    set('hud-streak',streak);
    set('hud-tiles',S.tiles.length+'/'+tileList.length);
    set('hud-hs',S.highscore);
  }

  cv.addEventListener('pointermove',e=>{
    const r=cv.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*W;
    paddle.x = Math.max(0,Math.min(W-paddle.w, x-paddle.w/2));
  });

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#07090A'; ctx.fillRect(0,0,W,H);
    bricks.forEach(b=>{
      if(!b.alive) return;
      const col = {common:'#5C564C',uncommon:'#2E7DA8',
                   rare:'#D98A2B',rarest:'#B0347A'}[b.q.rarity]||'#5C564C';
      ctx.fillStyle=col; ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle='rgba(0,0,0,.34)'; ctx.fillRect(b.x,b.y+b.h-4,b.w,4);
      ctx.fillStyle='#0B0D0E'; ctx.font='9px ui-monospace,Menlo,monospace';
      ctx.fillText(b.q.tile.slice(0,9), b.x+6, b.y+16);
    });
    ctx.fillStyle = Date.now()<powerUntil ? '#B0347A' : '#EDE7DA';
    ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
    ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,7);
    ctx.fillStyle='#D98A2B'; ctx.fill();
    if(paused){
      ctx.fillStyle='rgba(7,9,10,.72)'; ctx.fillRect(0,0,W,H);
    }
  }

  function step(){
    if(!running) return;
    if(!paused){
      ball.x+=ball.vx; ball.y+=ball.vy;
      if(ball.x<ball.r||ball.x>W-ball.r){ ball.vx*=-1;
        ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x)); }
      if(ball.y<ball.r){ ball.vy*=-1; ball.y=ball.r; }

      /* paddle — angle off centre, flipper-ish */
      const wide = Date.now()<powerUntil ? paddle.w*1.5 : paddle.w;
      const px = Date.now()<powerUntil ? paddle.x-(wide-paddle.w)/2 : paddle.x;
      if(ball.vy>0 && ball.y+ball.r>=paddle.y &&
         ball.y-ball.r<paddle.y+paddle.h &&
         ball.x>px && ball.x<px+wide){
        const hit=(ball.x-(px+wide/2))/(wide/2);
        const sp = Math.hypot(ball.vx,ball.vy);
        const ang = hit*1.05;
        ball.vx = Math.sin(ang)*sp; ball.vy = -Math.abs(Math.cos(ang)*sp);
        ball.y = paddle.y-ball.r-1;
      }

      for(const b of bricks){
        if(!b.alive) continue;
        if(ball.x>b.x-ball.r && ball.x<b.x+b.w+ball.r &&
           ball.y>b.y-ball.r && ball.y<b.y+b.h+ball.r){
          ball.vy*=-1;
          paused=true;
          ask(b);
          break;
        }
      }

      if(ball.y>H+20){
        lives--; hud();
        if(lives<=0){ over(); return; }
        streak=0; launch();
      }
      if(bricks.every(b=>!b.alive)){ layout(); toast('Board cleared — again.'); }
    }
    draw();
    raf=requestAnimationFrame(step);
  }

  /* the ball breaking a brick asks the question */
  function ask(brick){
    const tier = page('p6').game.difficulty.tiers[S.difficulty||'normal'];
    const box = el('div',{class:'brickq'});
    const inner = el('div',{class:'inner'});
    const bar = el('div',{class:'timer'},el('i',{}));
    inner.append(bar);
    inner.append(el('p',{class:'stem'},brick.q.stem));
    const opts = el('div',{class:'opts'});
    let settled=false, timer=null;

    const finish = (ok,picked)=>{
      if(settled) return; settled=true;
      clearTimeout(timer);
      if(ok){
        brick.alive=false; score+=10+streak*5; streak++;
        collectTile(brick.q.tile);
        if(streak===page('p6').game.powerup.streak){
          powerUntil = Date.now()+9000; toast('Power-up — wider paddle, 9s');
        }
        if(streak===page('p6').game.rare_unlock.streak){
          const rare = tileList.find(t=>
            (t.rarity==='rare'||t.rarity==='rarest') && !S.tiles.includes(t.id));
          if(rare){ collectTile(rare.id); toast('Five in a row — rare tile unlocked'); }
        }
      }else{
        streak=0;
        /* wrong restores the brick */
        if(mode==='review'){
          $$('button',opts).forEach(b=>{
            if(b.dataset.letter===brick.q.key) b.classList.add('was-right'); });
        }
      }
      hud();
      const close = ()=>{ box.remove(); paused=false; };
      if(!ok && mode==='review'){
        inner.append(el('div',{class:'feedback',style:'margin-top:13px'},
          el('h4',{},'The claim in full'),
          el('p',{style:'margin:0'},brick.q.full),
          el('p',{class:'source-line'},'['+brick.q.cite+']')));
        inner.append(el('div',{class:'actions'},
          el('button',{class:'btn btn-accent',onclick:close},'Keep going')));
      }else{
        setTimeout(close, ok?280:600);
      }
    };

    ['A','B','C','D'].forEach((L,i)=>{
      if(!brick.q.options[i]) return;
      const b = el('button',{type:'button'},brick.q.options[i]);
      b.dataset.letter=L;
      b.addEventListener('click',()=>{
        if(settled) return;
        const ok = L===brick.q.key;
        b.classList.add(ok?'picked-right':'picked-wrong');
        $$('button',opts).forEach(x=>x.disabled=true);
        if(ok) burst(b);
        finish(ok,L);
      });
      opts.append(b);
    });
    inner.append(opts);
    box.append(inner);
    screen.append(box);

    const ms = tier.show_s*1000;
    bar.querySelector('i').style.animation = `drain ${ms}ms linear forwards`;
    timer = setTimeout(()=>{
      $$('button',opts).forEach(x=>x.disabled=true);
      finish(false,null);
    }, ms);
  }

  function over(){
    running=false; cancelAnimationFrame(raf);
    if(score>S.highscore){ S.highscore=score; save();
      toast('New high score: '+score); }
    hud();
    const box = el('div',{class:'brickq'});
    box.append(el('div',{class:'inner'},
      el('h3',{class:'flyer flyer-m',style:'margin:0 0 9px'},'Game over'),
      el('p',{style:'margin:0 0 6px'},'Score '+score+
        '. High score '+S.highscore+'.'),
      el('p',{class:'source-line'},'Tiles collected this run stay collected.'),
      el('div',{class:'actions'},
        el('button',{class:'btn btn-accent',onclick:()=>{
          box.remove(); start(mode); }},'Run it again'),
        el('button',{class:'btn',onclick:()=>box.remove()},'Stop'))));
    screen.append(box);
  }

  function start(m){
    mode=m;
    $$('.brickq',screen).forEach(x=>x.remove());
    reset(); running=true;
    cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
    toast(m==='review' ? 'Review run — misses are explained'
                       : 'High-score run — nothing is explained');
  }

  reset(); draw();
  return {start};
}

/* ------------------------------------------------------------
   MINI-EXAM — blind. no feedback until all 8 are done.
   Then only "Go back to Page N". Never what was wrong.
   ------------------------------------------------------------ */
function miniExamBlock(p){
  const mx = p.miniexam;
  const box = el('div',{class:'panel',style:'max-width:940px;margin:34px auto 0'});
  box.append(el('h3',{},'Mini-exam — 8 items, blind'));
  box.append(el('p',{style:'margin:0 0 16px;font-size:14.5px;color:#B4A99B'},
    'No feedback until every item is answered. When you finish you get a list of '+
    'pages to go back to. You will not be told which item sent you there.'));

  const holder = el('div',{});
  const done = S.miniexam.submitted;

  mx.nodes.forEach((n,i)=>{
    const rec = S.miniexam.answers[n.id];
    const card = el('article',{class:'node',
      style:'background:#141110;border-color:#2B2521'});
    card.append(el('div',{class:'qno'},'Item '+(i+1)+' of '+mx.nodes.length,
      n.points?' · '+n.points+' credits':''));
    card.append(el('p',{class:'stem'},n.stem));

    if(n.kind==='MC'){
      const opts = el('div',{class:'opts'});
      ['A','B','C','D'].forEach((L,j)=>{
        if(!n.options[j]) return;
        const b = el('button',{type:'button'},n.options[j]);
        b.dataset.letter=L;
        b.style.borderColor='#4A3F38';
        if(rec){ b.disabled=true;
          if(rec.value===L) b.style.borderColor='#EDE7DA'; }
        b.addEventListener('click',()=>{
          if(S.miniexam.answers[n.id]) return;
          S.miniexam.answers[n.id]={value:L,correct:L===n.key};
          save();
          $$('button',opts).forEach(x=>{x.disabled=true;});
          b.style.borderColor='#EDE7DA';   /* answered. not judged. */
          checkExamDone();
        });
        opts.append(b);
      });
      card.append(opts);
    }else{
      const ta = el('textarea',{placeholder:'Write your response.'});
      if(rec){ ta.value=rec.value||''; ta.disabled=true; }
      card.append(ta);
      const btn = el('button',{class:'btn'},rec?'Submitted':'Submit');
      if(rec) btn.disabled=true;
      btn.addEventListener('click',()=>{
        if(S.miniexam.answers[n.id]) return;
        const t=ta.value.trim();
        if(t.length<40){ toast('Give it a full response.'); return; }
        const j = judgeCR(t,n);
        S.miniexam.answers[n.id]={value:t,correct:j.correct};
        save(); ta.disabled=true; btn.disabled=true; btn.textContent='Submitted';
        checkExamDone();
      });
      card.append(el('div',{class:'actions'},btn));
    }
    holder.append(card);
  });
  box.append(holder);

  const result = el('div',{id:'mx-result'});
  box.append(result);

  function checkExamDone(){
    const answered = Object.keys(S.miniexam.answers).length;
    if(answered < mx.nodes.length) return;
    S.miniexam.submitted = true; save();
    renderNav(); afterAnswer({page:'p6'});
    paintExamResult();
  }
  function paintExamResult(){
    result.innerHTML='';
    if(!S.miniexam.submitted) return;
    const misses = mx.nodes.filter(n=>{
      const r=S.miniexam.answers[n.id]; return r && !r.correct; });
    const targets = [...new Set(misses.map(n=>n.reveal_target).filter(Boolean))];
    const blk = el('div',{class:'feedback',style:'margin-top:16px'});
    blk.append(el('h4',{},'Mini-exam complete'));
    if(!targets.length){
      blk.append(el('p',{style:'margin:0'},'Nothing to go back to.'));
    }else{
      blk.append(el('p',{style:'margin:0 0 8px'},'Go back to:'));
      blk.append(el('ul',{style:'margin:0'},
        ...targets.map(t=>el('li',{},t))));
    }
    result.append(blk);
  }
  if(done) paintExamResult();
  return box;
}

/* ============================================================
   LEADERBOARD — the regroup page. Not the splash.
   ============================================================ */
function totals(){
  const tiles = S.tiles.length, tilesT = tileList.length;
  const chips = S.chips.length, chipsT = D.leaderboard.chips_total;
  const syn   = S.synth.length, synT   = allSynth.length;
  const pct = (tiles+chips+syn) / (tilesT+chipsT+synT);
  return {tiles,tilesT,chips,chipsT,syn,synT,pct};
}
function trophyLevel(){
  const {pct,syn,synT} = totals();
  const tr = D.leaderboard.trophies;
  if(pct>=tr.platinum && syn>=synT) return 'platinum';
  if(pct>=tr.gold)   return 'gold';
  if(pct>=tr.silver) return 'silver';
  if(pct>=tr.bronze) return 'bronze';
  return null;
}

    S.avatar.name=nameIn.value; save(); paintPlaque(); });
  av.append(nameIn);
  av.append(el('p',{class:'source-line'},L.avatar.era));
  g.append(av);

  /* ---- score + trophies ---- */
  const sc = el('div',{class:'card-box c4'});
  sc.append(el('h3',{},'Achievement'));
  const line = (lab,a,b)=>el('div',{style:'margin-bottom:11px'},
    el('div',{class:'progress'},lab+' — '+a+' of '+b),
    el('div',{class:'bar'},el('i',{style:'width:'+(b?a/b*100:0)+'%'})));
  sc.append(line('Fact tiles',T.tiles,T.tilesT));
  sc.append(line('Chips',T.chips,T.chipsT));
  sc.append(line('Synthesis cards',T.syn,T.synT));
  sc.append(el('div',{class:'progress',style:'margin:14px 0 9px'},
    'Overall — '+Math.round(T.pct*100)+'%'));
  const lvl = trophyLevel();
  const rank = {bronze:1,silver:2,gold:3,platinum:4};
  sc.append(el('div',{class:'trophies'},
    ...['bronze','silver','gold','platinum'].map(k=>
      el('div',{class:'troph'+(lvl&&rank[k]<=rank[lvl]?' won':'')},
        el('div',{class:'cup'},'🏆'),
        el('div',{class:'n'},k+' '+Math.round(L.trophies[k]*100)+'%')))));
  sc.append(el('p',{class:'source-line'},
    'Platinum requires '+L.trophies.platinum_requires+'.'));
  sc.append(el('p',{class:'source-line'},
    'Difficulty: '+(S.difficulty||'not picked')+
    (S.dlocked?' · locked':'') + ' · High score '+S.highscore));
  g.append(sc);

  /* ---- tokens on a spindle ---- */
  const tk = el('div',{class:'card-box c4'});
  tk.append(el('h3',{},'Tokens'));
  tk.append(el('p',{style:'margin:0 0 9px;font-size:14px'},
    L.token_object+'. One drops for every fragment you earn.'));
  const earned = D.essay.fragments.filter(fragmentEarned);
  const sp = el('div',{class:'spindle'});
  sp.append(el('div',{class:'rod'}), el('div',{class:'base'}));
  earned.forEach((f,i)=>{
    const r = el('div',{class:'rec'+(f.rarity==='rarest'?' spin':''),
      'data-r':f.rarity, title:f.text+' — '+f.rarity});
    r.style.bottom = (10+i*13)+'px';
    sp.append(r);
  });
  if(!earned.length) sp.append(el('div',{class:'source-line',
    style:'position:absolute;bottom:22px'},'Empty spindle. Answer a CR.'));
  tk.append(sp);
  tk.append(el('div',{class:'token-key'},
    el('div',{},el('i',{style:'background:#8A857C'}),'common — plain label'),
    el('div',{},el('i',{style:'background:#2E7DA8'}),'uncommon — blue label'),
    el('div',{},el('i',{style:'background:#D98A2B'}),'rare — gold label'),
    el('div',{},el('i',{style:'background:#B0347A'}),'rarest — spins')));
  g.append(tk);

  /* ---- the wall ---- */
  const wl = el('div',{class:'card-box c8'});
  wl.append(el('h3',{},'The wall'));
  wl.append(el('p',{style:'margin:0 0 13px;font-size:14px'},
    'Chips and records hang here. The empty nails are the point — you can see '+
    'what you have not got.'));
  const wall = el('div',{class:'wall'});
  wall.append(el('div',{class:'drip'}), el('div',{class:'drip two'}));
  const nails = el('div',{class:'nails'});
  const chipNodes = Object.values(nodeById).filter(n=>n.game==='chip');
  chipNodes.forEach(n=>{
    const got = S.chips.includes(n.id);
    const nail = el('div',{class:'nail'+(got?'':' empty'),
      title: got ? 'Chip from '+n.id : 'Empty nail — '+n.id});
    if(got) nail.append(el('div',{class:'hung'},
      el('div',{class:'chip','data-r':'rare'},el('i',{class:'edge'}))));
    nails.append(nail);
  });
  D.essay.fragments.forEach(f=>{
    const got = fragmentEarned(f);
    const nail = el('div',{class:'nail'+(got?'':' empty'),
      title: got ? f.text : 'Empty nail — record from '+f.from});
    if(got){
      const r = el('div',{class:'rec','data-r':f.rarity});
      r.style.cssText += 'position:relative;width:46px;height:46px;'+
        'transform:none;left:auto;';
      nail.append(el('div',{class:'hung'},r));
    }
    nails.append(nail);
  });
  wall.append(nails);
  wl.append(wall);
  g.append(wl);

  /* ---- plaque under glass ---- */
  const pl = el('div',{class:'card-box c4'});
  pl.append(el('h3',{},'Under glass'));
  const cse = el('div',{class:'plaque-case',id:'plaque-case'});
  pl.append(cse, el('p',{class:'source-line',id:'plaque-note'},''));
  g.append(pl);

  /* ---- organizer ---- */
  const org = el('div',{class:'card-box c12'});
  org.append(el('h3',{},'Planning page'));
  const tbl = el('table',{class:'reg'});
  tbl.append(el('thead',{},el('tr',{},
    el('th',{},''), ...L.organizer.columns.map(c=>el('th',{},c)))));
  const tb = el('tbody',{});
  L.organizer.rows.forEach((rw,i)=>{
    const tr = el('tr',{});
    tr.append(el('td',{},rw));
    const yes = el('td',{});
    const yb = el('button',{class:'btn',style:'padding:5px 12px'},
      S.organizer['row'+i]?'Yes ✓':'Yes');
    yb.addEventListener('click',()=>{
      S.organizer['row'+i] = !S.organizer['row'+i]; save();
      yb.textContent = S.organizer['row'+i]?'Yes ✓':'Yes'; });
    yes.append(yb); tr.append(yes);

    const circ = el('td',{});
    const cw = el('div',{class:'circles'});
    ['D1','D2','D3','D4','D5'].forEach((d,j)=>{
      const owner = {D1:'p1',D2:'p2',D3:'p3',D4:'p4',D5:'p5'}[d];
      const ready = pageDone(owner);
      const b = el('button',{class:S.organizer[d]?'on':'', disabled:!ready||null,
        title: ready ? d : d+' circles when Page '+owner.slice(1)+' says done'},
        String(j+1));
      b.addEventListener('click',()=>{
        S.organizer[d]=!S.organizer[d]; save();
        b.classList.toggle('on',S.organizer[d]); });
      cw.append(b);
    });
    circ.append(cw); tr.append(circ);
    const oi = el('td',{});
    const ta = el('textarea',{style:'width:100%;min-height:52px;padding:7px;'+
      'border:1px solid var(--rule);background:var(--bg)',
      placeholder:'One or two ideas'});
    ta.value = S.organizer['oi'+i]||'';
    ta.addEventListener('input',()=>{ S.organizer['oi'+i]=ta.value; save(); });
    oi.append(ta); tr.append(oi);
    tb.append(tr);
  });
  tbl.append(tb); org.append(tbl);
  g.append(org);

  /* ---- documents-to-issue chart ---- */
  const ch = el('div',{class:'card-box c12'});
  ch.append(el('h3',{},'Documents to issue'));
  ch.append(el('p',{style:'margin:0 0 13px;font-size:14px'},
    'Pick the issue you will argue. An issue needs at least '+
    D.essay.requires_docs+' documents behind it.'));
  const ct = el('table',{class:'reg'});
  ct.append(el('thead',{},el('tr',{},el('th',{},'Enduring issue'),
    ...['D1','D2','D3','D4','D5'].map(d=>el('th',{},d)),
    el('th',{},'Use it'))));
  const ctb = el('tbody',{});
  L.chart.forEach((row,i)=>{
    const tr = el('tr',{});
    tr.append(el('td',{},row.issue));
    ['D1','D2','D3','D4','D5'].forEach(d=>
      tr.append(el('td',{style:'text-align:center'},
        row.docs.includes(d)?'●':'')));
    const pick = el('td',{});
    const b = el('button',{class:'btn'+(S.chosenIssue===i?' btn-accent':''),
      style:'padding:6px 13px'}, S.chosenIssue===i?'Chosen':'Choose');
    b.addEventListener('click',()=>{
      S.chosenIssue = S.chosenIssue===i ? null : i; save();
      $('#board-essay')?.replaceWith(essayBuilder());
      $$('tbody tr',ct).forEach((r,j)=>{
        const bb = r.querySelector('button');
        bb.className = 'btn'+(S.chosenIssue===j?' btn-accent':'');
        bb.style.padding='6px 13px';
        bb.textContent = S.chosenIssue===j?'Chosen':'Choose';
      });
    });
    pick.append(b); tr.append(pick);
    ctb.append(tr);
  });
  ct.append(ctb); ch.append(ct);
  g.append(ch);

  /* ---- essay builder ---- */
  g.append(essayBuilder());

  /* ---- rubric + worked example ---- */
  const rb = el('div',{class:'card-box c6'});
  rb.append(el('h3',{},'How this gets read'));
  rb.append(el('p',{style:'margin:0 0 13px;font-size:14px'},
    'Descriptors only. There is no score here and there will not be one.'));
  const rg = el('div',{class:'rubric-grid'});
  const CRIT = D.essay.rubric.criteria;
  Object.entries(D.essay.rubric.levels).sort((a,b)=>b[0]-a[0]).forEach(([lv,d])=>{
    rg.append(el('div',{class:'rubric-row'},
      el('div',{class:'lvl'},d),
      el('div',{},
        d==='analytical' ? 'Names the issue, uses at least three documents accurately, '+
          'brings in outside information, and shows the issue enduring or changing.' :
        d==='mixed' ? 'Names the issue and uses documents, but leans on retelling '+
          'where it should be explaining.' :
        d==='descriptive' ? 'Retells what the documents say. The issue is present but '+
          'not argued.' :
        'Does not address the task.')));
  });
  rb.append(rg);
  rb.append(el('p',{class:'source-line'},'Criteria: '+CRIT.join(' · ')));
  rb.append(el('p',{class:'source-line'},'Axes: '+D.essay.rubric.axes.join(' · ')));
  g.append(rb);

  const we = el('div',{class:'card-box c6'});
  we.append(el('h3',{},'Worked example'));
  we.append(el('p',{class:'kicker',style:'margin-bottom:11px'},
    D.essay.worked_example.issue));
  we.append(el('div',{class:'two-col'},
    el('div',{},el('div',{class:'kicker',style:'margin-bottom:7px'},
      'Document evidence'),
      el('p',{style:'margin:0;font-size:14.5px'},
        D.essay.worked_example.document_evidence)),
    el('div',{},el('div',{class:'kicker',style:'margin-bottom:7px'},
      'Project knowledge'),
      el('p',{style:'margin:0;font-size:14.5px'},
        D.essay.worked_example.project_knowledge))));
  g.append(we);

  wrap.append(g);
  sec.append(wrap);
  setTimeout(paintPlaque,0);
  return sec;
};

function paintPlaque(){
  const cse = $('#plaque-case'); if(!cse) return;
  const won = trophyLevel()==='platinum';
  cse.innerHTML='';
  cse.append(el('div',{class:'plaque'+(won?'':' locked')},
    el('div',{class:'eng'},
      won ? (S.avatar.name||'—') : '—', el('br',{}),
      won ? 'Nirvana' : 'Nirvana', el('br',{}),
      el('span',{style:'font-size:11px;letter-spacing:.24em'},
        won?'PLATINUM':'NOT YET'))));
  const note = $('#plaque-note');
  if(note) note.textContent = won
    ? 'Earned. Engraved with your avatar name. You can look at it.'
    : 'Behind glass from your first visit. Earned at platinum — every tile, '+
      'every chip, every synthesis card. Cannot be touched.';
}

/* ============================================================
   ESSAY BUILDER
   Fragments are phrases. Drag into slots. Slots unlock on page done.
   80% supplied, 20% blank, floor guaranteed.
   ============================================================ */
function availableFragments(){
  const earned = D.essay.fragments.filter(fragmentEarned);
  if(earned.length >= D.essay.floor.fragments) return {frags:earned, floored:false};
  /* floor: hand over the lowest-rarity fragments as blanks with the doc name */
  const rank = {common:0,uncommon:1,rare:2,rarest:3};
  const rest = D.essay.fragments.filter(f=>!fragmentEarned(f))
    .sort((a,b)=>(rank[a.rarity]||0)-(rank[b.rarity]||0));
  const need = D.essay.floor.fragments - earned.length;
  const handed = rest.slice(0,need).map(f=>Object.assign({},f,
    {text:'[ blank — from '+f.from+' ]', blanked:true}));
  return {frags:earned.concat(handed), floored:true};
}

function essayBuilder(){
  const box = el('div',{class:'card-box c12',id:'board-essay'});
  box.append(el('h3',{},'Essay builder'));
  box.append(el('p',{class:'setup',style:'border-left-color:var(--accent)'},
    D.essay.task));
  box.append(el('p',{style:'margin:0 0 6px;font-size:14px'},
    'Requires at least '+D.essay.requires_docs+' documents, plus: '+
    D.essay.requires.join(' · ')+'.'));

  const chosen = S.chosenIssue!=null ? D.leaderboard.chart[S.chosenIssue] : null;
  box.append(el('p',{class:'source-line',style:'margin-bottom:16px'},
    chosen ? 'Your issue: '+chosen.issue+' — supported by '+chosen.docs.join(', ')
           : 'No issue chosen yet. Pick one in the chart above.'));

  const {frags,floored} = availableFragments();
  const used = new Set();
  Object.values(S.essay).forEach(p=>(p.frags||[]).forEach(id=>used.add(id)));

  /* tray */
  const tray = el('div',{class:'frag-tray',style:'margin-bottom:20px'});
  tray.append(el('div',{class:'kicker',style:'width:100%;margin-bottom:7px'},
    'Fragments — '+frags.length+' available'+
    (floored?' (floor applied: blanks handed over)':'')));
  frags.forEach(f=>{
    const chip = el('div',{class:'frag'+(used.has(f.id)?' used':''),
      'data-r':f.rarity, draggable: used.has(f.id)?'false':'true',
      'data-frag':f.id, title:'from '+f.from+' · '+f.rarity}, f.text);
    chip.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('text/plain',f.id);
      chip.classList.add('dragging'); });
    chip.addEventListener('dragend',()=>chip.classList.remove('dragging'));
    tray.append(chip);
  });
  if(!frags.length) tray.append(el('p',{style:'margin:0;opacity:.7'},
    'Nothing yet. Answer a constructed response and a fragment drops here.'));
  box.append(tray);

  /* paragraph slots */
  const UNLOCK = {'p1.done':'p1','p2.done':'p2','p3.done':'p3',
                  'p5.done':'p5','p6.done':'p6'};
  D.essay.paragraphs.forEach(spec=>{
    const owner = UNLOCK[spec.unlocks_on];
    const open = owner ? pageDone(owner) : true;
    S.essay[spec.slot] = S.essay[spec.slot] || {frags:[],text:'',outside:''};
    const st = S.essay[spec.slot];

    const para = el('div',{class:'para'+(open?'':' locked')});
    para.append(el('h4',{},
      el('span',{},spec.slot.toUpperCase()+
        (spec.doc?' · '+spec.doc:'')+' · '+spec.fragments+
        (spec.fragments>1?' fragments':' fragment')),
      el('span',{}, open ? 'unlocked'
        : 'locked until Page '+owner.slice(1)+' says done')));

    if(spec.doc){
      const d = allDocs[spec.doc];
      para.append(el('p',{class:'source-line',style:'margin:0 0 9px'},
        spec.doc+' — '+(d? (d.caption||d.setup||d.kind) : 'document')));
    }
    if(spec.slot==='intro' && chosen)
      para.append(el('p',{class:'source-line',style:'margin:0 0 9px'},
        'Issue: '+chosen.issue));

    /* drop zone */
    const dz = el('div',{class:'dropzone'});
    const paintZone = ()=>{
      dz.innerHTML='';
      if(!st.frags.length) dz.append(el('span',{class:'source-line'},
        open?'Drag '+spec.fragments+' here':'Locked'));
      st.frags.forEach(fid=>{
        const f = D.essay.fragments.find(x=>x.id===fid);
        const c = el('div',{class:'frag placed','data-r':f?f.rarity:'common'},
          f?f.text:fid,
          el('button',{style:'margin-left:8px;opacity:.6',onclick:()=>{
            st.frags = st.frags.filter(x=>x!==fid); save();
            $('#board-essay').replaceWith(essayBuilder());
          }},'×'));
        dz.append(c);
      });
    };
    paintZone();
    if(open){
      dz.addEventListener('dragover',e=>{ e.preventDefault();
        dz.classList.add('over'); });
      dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
      dz.addEventListener('drop',e=>{
        e.preventDefault(); dz.classList.remove('over');
        const id = e.dataTransfer.getData('text/plain');
        if(!id || st.frags.includes(id)) return;
        if(st.frags.length >= spec.fragments){
          toast('This paragraph takes '+spec.fragments+'.'); return; }
        st.frags.push(id); save();
        $('#board-essay').replaceWith(essayBuilder());
      });
    }
    para.append(dz);

    /* write the fragment into a sentence, in place */
    const ta = el('textarea',{disabled: open?null:'disabled',
      placeholder: open
        ? 'Write these fragments into full sentences here.'
        : 'Locked.'});
    ta.value = st.text||'';
    ta.addEventListener('input',()=>{ st.text=ta.value; save(); });
    para.append(ta);

    if(spec.outside_info !== undefined){
      const oi = el('textarea',{disabled: open?null:'disabled',
        placeholder:'Outside information — something you know that is not in the documents.',
        style:'min-height:64px'});
      oi.value = st.outside||'';
      oi.addEventListener('input',()=>{ st.outside=oi.value; save(); });
      para.append(oi);
    }
    if(spec.requires) para.append(el('div',{class:'req'},spec.requires));
    box.append(para);
  });

  /* modes */
  const acts = el('div',{class:'actions',style:'margin-top:16px'});
  acts.append(el('button',{class:'btn btn-accent',onclick:readAloud},
    'Read-aloud mode'));
  if(D.essay.swap_mode)
    acts.append(el('button',{class:'btn',onclick:swapMode},'Swap mode'));
  acts.append(el('button',{class:'btn',onclick:exportSave},'Export save'));
  box.append(acts);
  box.append(el('p',{class:'source-line'},
    'Floor: '+D.essay.floor.docs+' documents and '+D.essay.floor.fragments+
    ' fragments guaranteed. '+D.essay.floor.fallback+'.'));
  return box;
}

/* read-aloud — projector. one paragraph a screen. spacebar advances. */
function readAloud(){
  const paras = D.essay.paragraphs
    .map(p=>({slot:p.slot, text:(S.essay[p.slot]||{}).text||''}))
    .filter(p=>p.text.trim());
  if(!paras.length){ toast('Nothing written yet.'); return; }
  let i=0;
  const ov = el('div',{id:'aloud'});
  const txt = el('div',{class:'txt'});
  const nav = el('div',{class:'nav'},'Spacebar advances · Esc closes');
  ov.append(txt,nav);
  const paint = ()=>{ txt.textContent = paras[i].text;
    nav.textContent = paras[i].slot.toUpperCase()+' — '+(i+1)+' of '+paras.length+
      ' · spacebar advances · esc closes'; };
  const key = e=>{
    if(e.key===' '){ e.preventDefault(); i=(i+1)%paras.length; paint(); }
    if(e.key==='Escape'){ ov.remove(); removeEventListener('keydown',key); }
  };
  addEventListener('keydown',key);
  ov.addEventListener('click',()=>{ i=(i+1)%paras.length; paint(); });
  paint();
  document.body.append(ov);
}

/* swap mode — paragraph-by-paragraph handoff. the form holds. */
function swapMode(){
  const box = el('div',{id:'aloud',style:'background:var(--bg);color:var(--fg)'});
  const inner = el('div',{style:'max-width:640px;width:100%'});
  inner.append(el('h2',{class:'flyer flyer-m',style:'margin:0 0 13px'},'Swap mode'));
  inner.append(el('p',{style:'margin:0 0 16px'},
    'Hand the machine to the next student. They pick a paragraph and write only that '+
    'one. Everything else stays locked while they have it. The form holds.'));
  D.essay.paragraphs.forEach(spec=>{
    const st = S.essay[spec.slot]||{frags:[],text:''};
    const b = el('button',{class:'btn',style:'display:block;width:100%;'+
      'text-align:left;margin-bottom:9px'},
      spec.slot.toUpperCase()+' — '+(st.text.trim()?'written':'empty')+
      ' · '+st.frags.length+' fragment(s)');
    b.addEventListener('click',()=>{
      box.remove();
      go('board');
      setTimeout(()=>{
        const paras = $$('#board-essay .para');
        const idx = D.essay.paragraphs.indexOf(spec);
        paras[idx]?.scrollIntoView({behavior:'smooth',block:'center'});
        paras.forEach((p,i)=>{ if(i!==idx) p.style.opacity='.25'; });
        toast('Swap: '+spec.slot+' is yours.');
      },120);
    });
    inner.append(b);
  });
  inner.append(el('button',{class:'btn btn-accent',style:'margin-top:9px',
    onclick:()=>box.remove()},'Close'));
  box.append(inner);
  document.body.append(box);
}

/* ============================================================
   BOOT
   ============================================================ */
if(!location.hash) location.hash = S.seenSplash ? 'board' : 'splash';
route();
