<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Second target</title>
<style>
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #fbfbfb; color: #1a1a1a; }
  .page { padding: 24px; }
  .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; background: #fff; }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  .note { margin: 0; padding: 8px 10px; background: #eef3ff; border-radius: 5px; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <h2>Second target</h2>
    <p class="note">Five nested elements: page, card, heading, note, tail.</p>
    <p class="tail">Tail paragraph on the second tab.</p>
  </div>
</div>
</body>
</html>
