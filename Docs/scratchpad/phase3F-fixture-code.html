<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phase 3F fixture</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f4f4f4; }
  .stage { position: relative; width: 800px; height: 600px; margin: 20px; background: #fff; }
  .box { position: absolute; width: 120px; height: 80px; color: #fff; padding: 8px; box-sizing: border-box; }
  .red { background: #c0392b; }
  .blue { background: #2980b9; }
  .green { background: #27ae60; }
  .gold { background: #b8860b; }
  h1 { position: absolute; left: 20px; top: 20px; margin: 0; font-size: 28px; }
  p { position: absolute; left: 20px; top: 70px; width: 400px; margin: 0; }
</style>
</head>
<body>
<div class="stage">
  <h1>Phase 3F fixture heading</h1>
  <p>A paragraph of fixture text for the text edit line.</p>
  <div class="box red" style="left: 40px; top: 140px;">red box</div>
  <div class="box blue" style="left: 200px; top: 140px;">blue box</div>
  <div class="box green" style="left: 360px; top: 140px;">green box</div>
  <div class="box gold" style="left: 520px; top: 140px;">gold box</div>
  <span style="position: absolute; left: 40px; top: 260px;">a span sibling</span>
</div>
</body>
</html>
